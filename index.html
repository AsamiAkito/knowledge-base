<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>我的空间 · 动态 / 知识库 / 收藏</title>

<!--
  ============================================================
   个人空间 —— 动态 / 知识库 / 收藏，单文件 + data.json
  ------------------------------------------------------------
   · 访客：只读，看不到编辑入口
   · 站主：访问一次带 #edit 的网址解锁编辑（存本机）
           可 发帖/编辑/删除/隐藏、导入文件、改文件夹结构、
           重命名、隐藏、下载；改完可「发布」到线上或「导出」备份
   · 内容源 = data.json（发布即写回 GitHub）；离线时用内置 SEED
  ============================================================
-->

<style>
  :root{
    --bg:#f2f0e9; --bg-soft:#e9e6dc; --card:#fbfaf6;
    --text:#171613; --text-soft:#54514a; --text-dim:#8a867b;
    --border:#dcd7cb; --border-s:#e7e3d8;
    --accent:#141310; --on-accent:#f6f4ee; --gold:#a9791a; --accent-so:#ebe7db;
    --like:#c0344d; --danger:#c0362c; --ok:#2f7d40;
    --shadow:0 1px 2px rgba(30,27,20,.05),0 10px 30px rgba(30,27,20,.07);
    --radius:8px;
    --mono:"SF Mono","JetBrains Mono","Cascadia Code",ui-monospace,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",Roboto,Helvetica,Arial,sans-serif;
    --display:"Bahnschrift","DIN Alternate","Oswald",var(--sans);
  }
  :root[data-theme="dark"]{
    --bg:#0b0c0e; --bg-soft:#141518; --card:#131417;
    --text:#eae9e3; --text-soft:#9a9a95; --text-dim:#66666a;
    --border:#26262b; --border-s:#1b1b1f;
    --accent:#ffcb33; --on-accent:#191307; --gold:#ffcb33; --accent-so:#292311;
    --like:#ff5c78; --danger:#ff6b6b; --ok:#51cf66;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 16px 38px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);
    line-height:1.7;letter-spacing:.01em;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
  a{color:var(--gold);text-decoration:none}a:hover{text-decoration:underline}
  button{font-family:inherit}
  textarea,input,select{font-family:inherit}

  header.site{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);
    backdrop-filter:saturate(1.3) blur(12px);-webkit-backdrop-filter:saturate(1.3) blur(12px);border-bottom:1px solid var(--border);border-top:2px solid var(--gold)}
  .site-row{max-width:1180px;margin:0 auto;padding:0 22px;height:60px;display:flex;align-items:center;gap:18px}
  .brand{display:flex;align-items:baseline;gap:2px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.04em;color:var(--text);cursor:pointer}
  .brand:hover{text-decoration:none}.brand .dot{color:var(--gold);font-weight:800}
  nav.tabs{display:flex;gap:4px}
  nav.tabs button{border:0;background:transparent;color:var(--text-soft);cursor:pointer;padding:8px 15px;border-radius:9px;font-size:14.5px;font-weight:600;transition:all .15s}
  nav.tabs button:hover{color:var(--text);background:var(--bg-soft)}
  nav.tabs button.active{color:var(--text);background:var(--bg-soft)}
  nav.tabs button.active::after{content:"";display:block;height:2px;border-radius:2px;background:var(--accent);margin:6px 6px -8px}
  .spacer{flex:1}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 12px;gap:6px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text-soft);cursor:pointer;font-size:14px;transition:all .15s}
  .icon-btn.sq{width:36px;padding:0}
  .icon-btn:hover{color:var(--text);border-color:var(--text-dim)}
  .icon-btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

  .toolbar{position:sticky;top:60px;z-index:35;background:var(--accent-so);border-bottom:1px solid var(--border);display:none}
  body.editing .toolbar{display:block}
  .toolbar-row{max-width:1180px;margin:0 auto;padding:9px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px}
  .tb-state{display:flex;align-items:center;gap:7px;color:var(--text-soft);font-weight:600}
  .tb-state .dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim)}
  .tb-state.dirty .dot{background:var(--danger)}.tb-state.dirty{color:var(--danger)}

  main{max-width:1180px;margin:0 auto;padding:26px 22px 90px}

  .btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:7px;padding:9px 16px;font-size:14px;font-weight:700;letter-spacing:.02em;cursor:pointer;white-space:nowrap;transition:opacity .15s,transform .1s}
  .btn:hover{opacity:.92}.btn:active{transform:translateY(1px)}
  .btn.sm{padding:6px 12px;font-size:13px;border-radius:6px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.soft{background:var(--card);color:var(--text-soft);border-color:var(--border)}
  .btn.soft:hover{color:var(--text);border-color:var(--text-dim)}
  .btn.danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .feed{max-width:640px;margin:0 auto}
  .feed-h{margin:4px 0 18px}.feed-h h1{margin:0 0 4px;font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:.01em}.feed-h p{margin:0;color:var(--text-soft);font-size:14px}
  .composer{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:18px}
  .composer textarea{width:100%;min-height:80px;border:1px solid var(--border);background:var(--bg-soft);border-radius:10px;padding:11px 13px;font-size:15px;color:var(--text);outline:0;resize:vertical}
  .composer textarea:focus{border-color:var(--accent);background:var(--card)}
  .composer .row2{display:flex;gap:9px;margin-top:10px;align-items:center}
  .composer .row2 input{flex:1;border:1px solid var(--border);background:var(--bg-soft);border-radius:9px;padding:8px 12px;font-size:13.5px;color:var(--text);outline:0}
  .post{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;transition:border-color .15s,box-shadow .2s}
  .post:hover{border-color:var(--text-dim);box-shadow:var(--shadow)}
  .post.hidden-item{opacity:.55;border-style:dashed}
  .post .top{display:flex;align-items:center;gap:11px;margin-bottom:11px}
  .avatar{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--accent-so);color:var(--accent);overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  .post .who{font-weight:600;font-size:14.5px}.post .when{font-size:12.5px;color:var(--text-dim)}
  .post .body{font-size:15px;cursor:pointer}.post .body p{margin:0 0 .7em}
  .post .body .clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
  .imgs{display:grid;gap:6px;margin:12px 0 2px;grid-template-columns:repeat(3,1fr)}
  .imgs.one{grid-template-columns:1fr;max-width:360px}.imgs.two{grid-template-columns:1fr 1fr}
  .imgs .ph{aspect-ratio:1;border-radius:10px;background:linear-gradient(135deg,var(--accent-so),var(--bg-soft));display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--text-dim);overflow:hidden}
  .imgs .ph img{width:100%;height:100%;object-fit:cover}
  .actions{display:flex;gap:22px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border-s);align-items:center}
  .act{display:inline-flex;align-items:center;gap:7px;color:var(--text-dim);cursor:pointer;font-size:13.5px;border:0;background:transparent;transition:color .15s;padding:0}
  .act:hover{color:var(--text)}.act.liked{color:var(--like)}.act svg{width:17px;height:17px}
  .act.liked svg{fill:var(--like);stroke:var(--like)}
  .pop{animation:pop .3s}@keyframes pop{0%{transform:scale(.8)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
  .edit-actions{display:flex;gap:6px;margin-left:auto;align-items:center}
  .mini{border:1px solid var(--border);background:var(--card);color:var(--text-soft);cursor:pointer;font-size:12px;padding:4px 9px;border-radius:7px;transition:all .15s}
  .mini:hover{color:var(--text);border-color:var(--text-dim)}
  .mini.danger:hover{color:var(--danger);border-color:var(--danger)}
  .hbadge{font-size:11px;font-weight:600;color:var(--text-dim);background:var(--bg-soft);border:1px solid var(--border);padding:1px 7px;border-radius:6px}

  .comments{margin-top:14px;padding-top:14px;border-top:1px solid var(--border-s)}
  .cmt{display:flex;gap:10px;margin-bottom:12px}.cmt .avatar{width:30px;height:30px;font-size:14px}
  .cmt .c-main{flex:1;min-width:0}.cmt .c-name{font-size:13px;font-weight:600}
  .cmt .c-name span{font-weight:400;color:var(--text-dim);margin-left:8px;font-size:12px}
  .cmt .c-text{font-size:14px;margin-top:1px;word-wrap:break-word}
  .cmt-form{display:flex;gap:9px;margin-top:6px}
  .cmt-form input{flex:1;border:1px solid var(--border);background:var(--bg-soft);border-radius:10px;padding:9px 13px;font-size:14px;color:var(--text);outline:0}
  .cmt-form input:focus{border-color:var(--accent);background:var(--card)}
  .backlink{display:inline-flex;align-items:center;gap:6px;margin:0 0 20px;color:var(--text-soft);font-size:14px;cursor:pointer;border:0;background:transparent;padding:0}
  .backlink:hover{color:var(--text)}
  .inline-editor textarea{width:100%;min-height:120px;border:1px solid var(--accent);background:var(--card);border-radius:10px;padding:11px 13px;font-size:15px;color:var(--text);outline:0;resize:vertical}
  .inline-editor .row2{display:flex;gap:9px;margin-top:10px}
  .inline-editor .row2 input{flex:1;border:1px solid var(--border);background:var(--bg-soft);border-radius:9px;padding:8px 12px;font-size:13.5px;color:var(--text);outline:0}

  .kb{display:grid;grid-template-columns:250px minmax(0,1fr) 270px;gap:26px;align-items:start}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
  .kb-tree{position:sticky;top:78px;padding:12px 10px;max-height:calc(100vh - 100px);overflow:auto}
  body.editing .kb-tree{top:120px}
  .kb-tree .ph-title{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--text-dim);padding:6px 10px 8px;text-transform:uppercase}
  .tree-tools{display:flex;gap:4px;padding:0 6px 8px;flex-wrap:wrap}
  .tree-tools button{flex:1;min-width:0;border:1px solid var(--border);background:var(--bg-soft);color:var(--text-soft);cursor:pointer;font-size:12px;padding:6px 4px;border-radius:8px;transition:all .15s;white-space:nowrap}
  .tree-tools button:hover{border-color:var(--accent);color:var(--accent)}
  .node .row{display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node .row:hover{background:var(--bg-soft);color:var(--text)}
  .node .row.sel{background:var(--accent-so);color:var(--accent);font-weight:600}
  .node .row .ic{width:16px;text-align:center;flex:none;font-size:12px;color:var(--text-dim)}
  .node .row.sel .ic{color:var(--accent)}
  .node .row.hidden-item{opacity:.5;font-style:italic}
  .node .row .eye{margin-left:auto;font-size:11px;opacity:.6}

  .kb-main{padding:26px 30px;min-height:60vh}
  .crumb{font-size:12.5px;color:var(--text-dim);margin-bottom:10px}.crumb .dot{opacity:.6;margin:0 3px}
  .kb-main h1.doc{margin:0 0 8px;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.01em}
  .doc-meta{font-size:12.5px;color:var(--text-dim);margin-bottom:12px}
  .doc-meta .t{background:var(--bg-soft);padding:2px 8px;border-radius:6px;margin-right:6px}
  .doc-tools{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 22px;padding-bottom:20px;border-bottom:1px solid var(--border-s)}
  .folder-list{list-style:none;padding:0;margin:16px 0 0}
  .folder-list li{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:14.5px}
  .folder-list li:hover{border-color:var(--text-dim);background:var(--bg-soft)}
  .folder-list li .ic{color:var(--text-dim)}

  .kb-notes{position:sticky;top:78px;padding:16px;max-height:calc(100vh - 100px);overflow:auto}
  body.editing .kb-notes{top:120px}
  .kb-notes .ph-title{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--text-dim);margin-bottom:12px;text-transform:uppercase}
  .sticky{background:linear-gradient(180deg,#fff8d6,#fdf3b8);color:#4a3f14;border-radius:10px;padding:11px 13px;font-size:13.5px;line-height:1.6;margin-bottom:12px;cursor:pointer;box-shadow:0 2px 8px rgba(120,100,20,.12);border:1px solid rgba(150,120,20,.15);transition:transform .12s}
  :root[data-theme="dark"] .sticky{background:linear-gradient(180deg,#3a3413,#332d10);color:#e8dca0;border-color:#4a4118}
  .sticky:hover{transform:translateY(-2px)}
  .sticky .n{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:rgba(150,120,20,.22);font-size:11px;font-weight:700;margin-right:7px}
  .kb-notes .hint{font-size:12.5px;color:var(--text-dim)}
  mark.hl{background:rgba(255,214,80,.4);border-radius:3px;padding:.05em .15em;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  :root[data-theme="dark"] mark.hl{background:rgba(230,190,70,.22);color:inherit}
  mark.hl:hover,mark.hl.flash{background:rgba(255,200,40,.75)}
  .sticky.flash{transform:scale(1.04);box-shadow:0 4px 16px rgba(180,140,20,.35)}

  .doc-editor label{display:block;font-size:12.5px;color:var(--text-soft);font-weight:600;margin:14px 0 6px}
  .doc-editor input.f,.doc-editor textarea.f{width:100%;border:1px solid var(--border);background:var(--bg-soft);border-radius:10px;padding:10px 13px;font-size:14px;color:var(--text);outline:0}
  .doc-editor input.f:focus,.doc-editor textarea.f:focus{border-color:var(--accent);background:var(--card)}
  .doc-editor textarea.body{min-height:340px;font:13.5px/1.7 var(--mono);resize:vertical}
  .note-edit{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
  .note-edit textarea{flex:1;min-height:46px;border:1px solid var(--border);background:var(--bg-soft);border-radius:9px;padding:8px 11px;font-size:13.5px;color:var(--text);outline:0;resize:vertical}

  .fav{display:grid;grid-template-columns:236px minmax(0,1fr);gap:26px;align-items:start}
  .fav-side{position:sticky;top:78px;padding:12px 10px}
  body.editing .fav-side{top:120px}
  .fav-side .ph-title{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--text-dim);padding:6px 10px 10px;text-transform:uppercase}
  .folder{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;cursor:pointer;transition:background .15s}
  .folder:hover{background:var(--bg-soft)}.folder.sel{background:var(--accent-so)}
  .folder.hidden-item{opacity:.5}
  .folder .thumb{width:44px;height:34px;border-radius:7px;flex:none;overflow:hidden;background:linear-gradient(135deg,var(--accent-so),var(--bg-soft));display:flex;align-items:center;justify-content:center;font-size:17px}
  .folder .thumb img{width:100%;height:100%;object-fit:cover}
  .folder .f-name{font-size:14px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .folder.sel .f-name{color:var(--accent)}.folder .f-count{font-size:12px;color:var(--text-dim)}
  .fav-main-head{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}.fav-main-head h1{margin:0;font-size:22px}
  .fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .fcard{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .15s,transform .12s,box-shadow .2s;position:relative}
  .fcard:hover{border-color:var(--text-dim);box-shadow:var(--shadow);transform:translateY(-2px)}
  .fcard.hidden-item{opacity:.55;border-style:dashed}
  .fcard .cover{aspect-ratio:16/10;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--accent-so),var(--bg-soft));display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer}
  .fcard .cover img{width:100%;height:100%;object-fit:cover}
  .fcard .src{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;letter-spacing:.03em}
  .fcard .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:38px;text-shadow:0 2px 10px rgba(0,0,0,.5);opacity:.9;pointer-events:none}
  .fcard .info{padding:11px 13px}
  .fcard .info .t{font-size:14px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .fcard .info .u{font-size:12px;color:var(--text-dim);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fcard .fedit{display:flex;gap:6px;padding:0 13px 12px}
  .embed-wrap{background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9;margin-bottom:16px}
  .embed-wrap iframe{width:100%;height:100%;border:0;display:block}

  .modal-bg{position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:460px;box-shadow:var(--shadow);max-height:88vh;overflow:auto}
  .modal h3{margin:0 0 4px;font-size:18px}.modal p.sub{margin:0 0 18px;color:var(--text-soft);font-size:13px}
  .field{margin-bottom:14px}.field label{display:block;font-size:12.5px;color:var(--text-soft);margin-bottom:6px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--border);background:var(--bg-soft);border-radius:10px;padding:10px 13px;font-size:14px;color:var(--text);outline:0}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--card)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
  .picklist{max-height:280px;overflow:auto;border:1px solid var(--border);border-radius:10px}
  .picklist button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--border-s);background:transparent;color:var(--text);padding:9px 13px;font-size:14px;cursor:pointer}
  .picklist button:hover{background:var(--bg-soft)}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .25s;z-index:80;box-shadow:var(--shadow);max-width:90vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .empty{text-align:center;color:var(--text-dim);padding:60px 0}
  .md p{margin:0 0 1.05em}
  .md h1,.md h2,.md h3{line-height:1.35;letter-spacing:-.01em;margin:1.7em 0 .7em}
  .md h1{font-size:24px}.md h2{font-size:20px}.md h3{font-size:17px}
  .md ul,.md ol{margin:0 0 1.05em;padding-left:1.5em}.md li{margin:.3em 0}
  .md a{text-decoration:underline;text-underline-offset:2px}.md img{max-width:100%;border-radius:10px}
  .md hr{border:0;border-top:1px solid var(--border);margin:2em 0}
  .md blockquote{margin:0 0 1.05em;padding:2px 16px;color:var(--text-soft);border-left:3px solid var(--accent);background:var(--bg-soft);border-radius:0 8px 8px 0}
  .md blockquote p:last-child{margin-bottom:0}
  .md code{font:.875em/1.5 var(--mono);background:var(--bg-soft);padding:.15em .4em;border-radius:5px;border:1px solid var(--border-s)}
  .md pre{background:var(--bg-soft);border:1px solid var(--border);border-radius:11px;padding:15px 16px;overflow-x:auto;margin:0 0 1.2em}

  @media(max-width:1040px){.kb{grid-template-columns:220px minmax(0,1fr)}.kb-notes{display:none}}

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app=$("#app");
const uid=()=>"n"+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2600);}

const KEY_STORE="myspace-store",KEY_DRAFT="myspace-draft",KEY_GH="myspace-gh",KEY_OWNER="myspace-owner",KEY_THEME="ms-theme";
let store=(()=>{try{return JSON.parse(localStorage.getItem(KEY_STORE))||{}}catch(e){return{}}})();
store.likes=store.likes||{};store.cmts=store.cmts||{};
function saveStore(){try{localStorage.setItem(KEY_STORE,JSON.stringify(store))}catch(e){}}

let DATA={feed:[],kb:[],fav:[]};
let dirty=false;
function saveDraft(){dirty=true;try{localStorage.setItem(KEY_DRAFT,JSON.stringify(exportData()))}catch(e){}updateBar();}
function clearDraft(){dirty=false;try{localStorage.removeItem(KEY_DRAFT)}catch(e){}updateBar();}
function ghCfg(){let c;try{c=JSON.parse(localStorage.getItem(KEY_GH))}catch(e){}return Object.assign({owner:"AsamiAkito",repo:"knowledge-base",branch:"main",path:"data.json",token:""},c||{});}

function applyTheme(t){document.documentElement.setAttribute("data-theme",t);$("#themeBtn").textContent=t==="dark"?"☀️":"🌙";try{localStorage.setItem(KEY_THEME,t)}catch(e){}}
(function(){let t;try{t=localStorage.getItem(KEY_THEME)}catch(e){}if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";applyTheme(t);})();

let ownerUnlocked=false;
(function(){try{if(location.hash.replace("#","").toLowerCase()==="edit"){localStorage.setItem(KEY_OWNER,"1");history.replaceState(null,"",location.pathname+location.search);}ownerUnlocked=localStorage.getItem(KEY_OWNER)==="1";}catch(e){}})();

let state={view:"feed",feedOpen:null,kbSel:null,favFolder:0,favItem:null,expanded:new Set(),editMode:false,editingPost:null,editingFile:false,composerText:"",moving:null,fileBuf:null};

let _hl=0;
function md(src){
  const blocks=[];
  src=(src||"").replace(/```(\w*)\n([\s\S]*?)```/g,function(_,l,c){blocks.push('<pre><code>'+esc(c.replace(/\n$/,""))+'</code></pre>');return "\nCBLK"+(blocks.length-1)+"CBLK\n";});
  const inline=t=>esc(t)
    .replace(/==([^=]+)==/g,(_,x)=>{_hl++;return '<mark class="hl" id="hl-'+_hl+'" data-action="kb-hl" data-n="'+_hl+'">'+x+'</mark>';})
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img alt="$1" src="$2">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/`([^`]+)`/g,(_,c)=>"<code>"+c+"</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g,"<em>$1</em>");
  const lines=src.split("\n");let html="",i=0;
  const list=(tag,items)=>"<"+tag+">"+items.map(x=>"<li>"+inline(x)+"</li>").join("")+"</"+tag+">";
  const isBlock=s=>/^\s*(#{1,3}\s|>|[-*]\s|\d+\.\s|---\s*$)/.test(s)||/^CBLK\d+CBLK$/.test(s.trim())||/^\s*$/.test(s);
  while(i<lines.length){
    let ln=lines[i];let bm=ln.trim().match(/^CBLK(\d+)CBLK$/);
    if(bm){html+=blocks[+bm[1]];i++;continue;}
    if(/^\s*$/.test(ln)){i++;continue;}
    let m;
    if(m=ln.match(/^(#{1,3})\s+(.*)$/)){html+="<h"+m[1].length+">"+inline(m[2])+"</h"+m[1].length+">";i++;continue;}
    if(/^\s*---\s*$/.test(ln)){html+="<hr>";i++;continue;}
    if(/^\s*>\s?/.test(ln)){let b=[];while(i<lines.length&&/^\s*>\s?/.test(lines[i])){b.push(lines[i].replace(/^\s*>\s?/,""));i++;}html+="<blockquote>"+md(b.join("\n"))+"</blockquote>";continue;}
    if(/^\s*[-*]\s+/.test(ln)){let it=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){it.push(lines[i].replace(/^\s*[-*]\s+/,""));i++;}html+=list("ul",it);continue;}
    if(/^\s*\d+\.\s+/.test(ln)){let it=[];while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){it.push(lines[i].replace(/^\s*\d+\.\s+/,""));i++;}html+=list("ol",it);continue;}
    let b=[];while(i<lines.length&&!isBlock(lines[i])){b.push(lines[i]);i++;}
    html+="<p>"+inline(b.join("\n")).replace(/\n/g,"<br>")+"</p>";
  }
  return html;
}
const now=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());};

function ensureIds(){
  (function walk(nodes){nodes.forEach(n=>{if(!n.id)n.id=uid();if(n.type==="folder"){n.children=n.children||[];walk(n.children);}});})(DATA.kb);
  DATA.feed.forEach(p=>{if(!p.id)p.id=uid();});
}
function locate(id,nodes=DATA.kb,parent=DATA.kb,trail=[]){
  for(let i=0;i<nodes.length;i++){const n=nodes[i];
    if(n.id===id)return{node:n,parent:nodes,index:i,trail:trail};
    if(n.type==="folder"&&n.children){const r=locate(id,n.children,n.children,trail.concat(n));if(r)return r;}
  }
  return null;
}
function firstFile(nodes=DATA.kb){for(const n of nodes){if(n.type==="file")return n.id;if(n.type==="folder"){const r=firstFile(n.children||[]);if(r)return r;}}return null;}
function collectFolders(banId){const out=[];(function w(nodes,d){nodes.forEach(n=>{if(n.type==="folder"){if(n.id===banId)return;out.push({id:n.id,name:n.name,depth:d});w(n.children||[],d+1);}});})(DATA.kb,0);return out;}
function targetChildren(){const s=state.kbSel?locate(state.kbSel):null;if(s&&s.node.type==="folder"){state.expanded.add(s.node.id);return s.node.children;}if(s)return s.parent;return DATA.kb;}

async function loadData(){
  try{const r=await fetch("data.json?_="+Date.now(),{cache:"no-store"});if(r.ok){const j=await r.json();if(j&&j.feed){DATA=j;dirty=false;return;}}}catch(e){}
  DATA=JSON.parse(JSON.stringify(SEED));dirty=false;
}

function setEdit(on){state.editMode=on;document.body.classList.toggle("editing",on);$("#editBtn").classList.toggle("on",on);$("#editBtn").textContent=on?"✓ 编辑中":"✎ 编辑";render();}
function hasDraft(){try{const d=JSON.parse(localStorage.getItem(KEY_DRAFT));return !!(d&&d.feed)}catch(e){return false}}
function updateBar(){const s=$("#tbState"),t=$("#tbText");if(!s)return;s.classList.toggle("dirty",dirty);
  t.textContent=dirty?"有未发布的修改":(hasDraft()?"显示线上版本（有未发布草稿）":"已同步线上");
  const rb=$("#restoreBtn");if(rb)rb.style.display=(!dirty&&hasDraft())?"":"none";}

function isImg(a){return /^https?:\/\//.test(a)||/^\.?\/?assets\//.test(a)||/^(data:|blob:)/.test(a)||/\.(jpe?g|png|gif|webp|svg|avif)$/i.test(a);}
function avatarHTML(a){a=a||(DATA.profile&&DATA.profile.avatar)||"🙂";return isImg(a)?'<img src="'+esc(a)+'" alt="">':esc(a);}
function feedComments(id){return (store.cmts[id]||[]).slice();}
function likeCount(id){const base=(id.charCodeAt(1)*7)%40+3;return base+(store.likes[id]?1:0);}
function postHTML(p,full){
  const liked=store.likes[p.id];const cs=feedComments(p.id);const imgs=(p.images||[]);const em=state.editMode;
  if(state.editingPost===p.id){
    return '<div class="post inline-editor"><textarea id="pe-'+p.id+'">'+esc(p.text)+'</textarea>'
      +'<div class="row2"><input id="pi-'+p.id+'" placeholder="图片(emoji 或图片URL，逗号分隔，可留空)" value="'+esc((imgs||[]).join(","))+'"></div>'
      +'<div class="edit-actions" style="margin-top:10px;justify-content:flex-end"><button class="btn sm" data-action="post-save" data-id="'+p.id+'">保存</button><button class="mini" data-action="post-cancel">取消</button></div></div>';
  }
  const imgHTML=imgs.length?'<div class="imgs '+(imgs.length===1?'one':imgs.length===2?'two':'')+'">'+imgs.map(x=>'<div class="ph">'+(/^https?:/.test(x)?'<img src="'+esc(x)+'" alt="">':esc(x))+'</div>').join("")+'</div>':"";
  const body='<div class="body '+(full?'':'clamp')+'" data-action="feed-open" data-id="'+p.id+'">'+md(p.text)+'</div>';
  const like='<button class="act '+(liked?'liked':'')+'" data-action="feed-like" data-id="'+p.id+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg><span>'+likeCount(p.id)+'</span></button>';
  const cmt='<button class="act" data-action="feed-open" data-id="'+p.id+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>'+(cs.length||'评论')+'</span></button>';
  const eActions=em?'<div class="edit-actions">'+(p.hidden?'<span class="hbadge">已隐藏</span>':'')
      +'<button class="mini" data-action="post-edit" data-id="'+p.id+'">编辑</button>'
      +'<button class="mini" data-action="post-hide" data-id="'+p.id+'">'+(p.hidden?'取消隐藏':'隐藏')+'</button>'
      +'<button class="mini danger" data-action="post-delete" data-id="'+p.id+'">删除</button></div>':'';
  let comments="";
  if(full){
    const clist=cs.map(c=>'<div class="cmt"><div class="avatar">'+esc((c.name||'我')[0])+'</div><div class="c-main"><div class="c-name">'+esc(c.name||'我')+'<span>'+esc(c.when||'')+'</span></div><div class="c-text">'+esc(c.text)+'</div></div></div>').join("");
    comments='<div class="comments">'+(clist||'<div style="color:var(--text-dim);font-size:13px;margin-bottom:12px">还没有评论，来说两句 👇</div>')
      +'<form class="cmt-form" data-action="feed-comment" data-id="'+p.id+'"><input name="text" placeholder="写下你的评论…" autocomplete="off" maxlength="300"/><button class="btn" type="submit">发送</button></form></div>';
  }
  const prof=DATA.profile||{name:"我",avatar:"🙂"};
  return '<div class="post'+(p.hidden?' hidden-item':'')+'"><div class="top"><div class="avatar">'+avatarHTML(prof.avatar)+'</div><div><div class="who">'+esc(prof.name||"我")+'</div><div class="when">'+esc(p.date)+'</div></div></div>'
    +body+imgHTML+'<div class="actions">'+like+cmt+eActions+'</div>'+comments+'</div>';
}
function renderFeed(){
  if(state.feedOpen){
    const p=DATA.feed.find(x=>x.id===state.feedOpen);
    if(!p){state.feedOpen=null;return renderFeed();}
    app.innerHTML='<div class="feed"><button class="backlink" data-action="view" data-view="feed"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>返回动态</button>'+postHTML(p,true)+'</div>';
    return;
  }
  const composer=state.editMode?'<div class="composer"><textarea id="composerText" placeholder="有什么新鲜事？支持 Markdown…">'+esc(state.composerText||"")+'</textarea>'
    +'<div class="row2"><input id="composerImg" placeholder="图片(emoji 或图片URL，逗号分隔，可留空)"><div class="spacer" style="flex:1"></div><button class="btn" data-action="post-new">发布动态</button></div></div>':'';
  const list=DATA.feed.filter(p=>state.editMode||!p.hidden);
  app.innerHTML='<div class="feed"><div class="feed-h"><h1>动态</h1><p>日常记录 · 随手的想法与片段</p></div>'+composer
    +(list.length?list.map(p=>postHTML(p,false)).join(""):'<div class="empty">还没有动态'+(state.editMode?'，在上面写第一条吧。':'。')+'</div>')+'</div>';
}

function treeHTML(nodes,depth){
  return nodes.filter(n=>state.editMode||!n.hidden).map(n=>{
    const pad='style="padding-left:'+(9+depth*15)+'px"';const hid=n.hidden?' hidden-item':'';const eye=n.hidden?'<span class="eye">🚫</span>':'';
    if(n.type==="folder"){
      const open=state.expanded.has(n.id);const sel=state.kbSel===n.id;
      return '<div class="node"><div class="row'+(sel?' sel':'')+hid+'" '+pad+' data-action="kb-folder" data-id="'+n.id+'"><span class="ic">'+(open?'▾':'▸')+'</span><span>'+esc(n.name)+'</span>'+eye+'</div>'+(open?'<div>'+treeHTML(n.children||[],depth+1)+'</div>':'')+'</div>';
    }
    const sel=state.kbSel===n.id;
    return '<div class="node"><div class="row'+(sel?' sel':'')+hid+'" '+pad+' data-action="kb-open" data-id="'+n.id+'"><span class="ic">'+(sel?'●':'○')+'</span><span>'+esc(n.name)+'</span>'+eye+'</div></div>';
  }).join("");
}
function fileEditorHTML(node){
  const b=state.fileBuf;
  const notes=(b.notes||[]).map((nt,i)=>'<div class="note-edit"><textarea data-note="'+i+'">'+esc(nt.text||"")+'</textarea><button class="mini danger" data-action="kbedit-note-del" data-i="'+i+'">✕</button></div>').join("");
  return '<div class="doc-editor"><div class="crumb">编辑文档</div>'
    +'<label>标题</label><input class="f" id="fe-name" value="'+esc(b.name||"")+'">'

function parseSource(url){let m;
  if(m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{11})/))return{src:"YouTube",embed:"https://www.youtube.com/embed/"+m[1],thumb:"https://img.youtube.com/vi/"+m[1]+"/hqdefault.jpg",icon:"▶"};
  if(m=url.match(/bilibili\.com\/video\/(BV[\w]+)/i))return{src:"Bilibili",embed:"https://player.bilibili.com/player.html?bvid="+m[1]+"&page=1&autoplay=0",thumb:null,icon:"📺"};
  return{src:"网页",embed:null,thumb:null,icon:"🔗"};}

function captureFileBuf(){if(!state.fileBuf)return;const nm=$("#fe-name"),tg=$("#fe-tags"),bd=$("#fe-body");if(nm)state.fileBuf.name=nm.value;if(tg)state.fileBuf.tags=tg.value.split(/[,，]/).map(s=>s.trim()).filter(Boolean);if(bd)state.fileBuf.body=bd.value;document.querySelectorAll("[data-note]").forEach(el=>{const i=+el.dataset.note;if(state.fileBuf.notes[i])state.fileBuf.notes[i].text=el.value;});}

function toB64(str){const bytes=new TextEncoder().encode(str);let bin="";const ch=0x8000;for(let i=0;i<bytes.length;i+=ch)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+ch));return btoa(bin);}
async function publish(){
  const cfg=ghCfg();if(!cfg.token){toast("请先在 ⚙ 发布设置 里填 GitHub 令牌");openSettings();return;}
  const base="https://api.github.com/repos/"+cfg.owner+"/"+cfg.repo+"/contents/"+cfg.path;
  const headers={Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  toast("正在发布…");
  try{
    let sha=null;
    try{const r=await fetch(base+"?ref="+encodeURIComponent(cfg.branch),{headers,cache:"no-store"});if(r.ok)sha=(await r.json()).sha;}catch(e){}
    const body={message:"更新内容（网页编辑器）",content:toB64(JSON.stringify(exportData(),null,2)),branch:cfg.branch};if(sha)body.sha=sha;
    const put=await fetch(base,{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},headers),body:JSON.stringify(body)});
    if(put.ok){clearDraft();toast("✓ 已发布！网站约 1 分钟后更新");}
    else{const e=await put.json().catch(()=>({}));toast("发布失败："+(e.message||put.status));}
  }catch(e){toast("发布出错（检查网络/代理）："+e.message);}
}

function flashPair(a,b){const t=document.getElementById(a),o=document.getElementById(b);if(t){t.scrollIntoView({behavior:"smooth",block:"center"});t.classList.add("flash");setTimeout(()=>t.classList.remove("flash"),1200);}if(o){o.classList.add("flash");setTimeout(()=>o.classList.remove("flash"),1200);}}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-action]");if(!el)return;const a=el.dataset.action;const id=el.dataset.id;
  switch(a){
    case "theme":applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");return;
    case "view":if(state.editMode)captureComposer();state.view=el.dataset.view;state.feedOpen=null;state.favItem=null;state.editingPost=null;state.editingFile=false;render();window.scrollTo(0,0);return;
    case "edit-toggle":if(state.editMode){captureComposer();setEdit(false);}else setEdit(true);return;
    case "publish":publish();return;
    case "export":doExport();return;
    case "ghsettings":openSettings();return;
    case "profile":openProfile();return;
    case "discard":if(confirm("丢弃本机未发布的草稿，并重新载入线上已发布的内容？")){clearDraft();boot();toast("已重载线上内容");}return;
    case "restore":{try{const d=JSON.parse(localStorage.getItem(KEY_DRAFT));if(d&&d.feed){DATA=d;ensureIds();if(!DATA.profile)DATA.profile={name:"我",avatar:"🙂"};dirty=true;updateBar();render();toast("已恢复未发布的草稿");}}catch(e){toast("没有可恢复的草稿");}return;}
    case "modal-close":closeModals();return;
    case "gh-clear":{const c=ghCfg();c.token="";localStorage.setItem(KEY_GH,JSON.stringify(c));closeModals();toast("已清除令牌");return;}

    case "feed-like":{store.likes[id]=!store.likes[id];saveStore();el.classList.toggle("liked",store.likes[id]);el.querySelector("span").textContent=likeCount(id);if(store.likes[id]){el.classList.add("pop");setTimeout(()=>el.classList.remove("pop"),300);}return;}
    case "feed-open":if(state.editMode&&state.editingPost)return;state.feedOpen=id;render();window.scrollTo(0,0);return;
    case "post-new":{const t=$("#composerText").value.trim();if(!t){toast("写点什么再发");return;}const imgs=$("#composerImg").value.split(/[,，]/).map(s=>s.trim()).filter(Boolean);DATA.feed.unshift({id:uid(),date:now(),text:t,images:imgs.length?imgs:undefined});state.composerText="";saveDraft();renderFeed();toast("已发布到本地，记得点上方“发布”同步线上");return;}
    case "post-edit":state.editingPost=id;renderFeed();return;
    case "post-cancel":state.editingPost=null;renderFeed();return;
    case "post-save":{const p=DATA.feed.find(x=>x.id===id);if(p){p.text=$("#pe-"+id).value;const imgs=$("#pi-"+id).value.split(/[,，]/).map(s=>s.trim()).filter(Boolean);p.images=imgs.length?imgs:undefined;}state.editingPost=null;saveDraft();renderFeed();return;}
    case "post-hide":{const p=DATA.feed.find(x=>x.id===id);if(p)p.hidden=!p.hidden;saveDraft();renderFeed();return;}
    case "post-delete":{if(confirm("删除这条动态？")){DATA.feed=DATA.feed.filter(x=>x.id!==id);saveDraft();state.feedOpen=null;renderFeed();}return;}

    case "kb-folder":state.kbSel=id;if(state.expanded.has(id))state.expanded.delete(id);else state.expanded.add(id);state.editingFile=false;renderKB();return;
    case "kb-open":state.kbSel=id;state.editingFile=false;renderKB();return;
    case "kb-hl":flashPair("note-"+el.dataset.n,"hl-"+el.dataset.n);return;
    case "kb-note":flashPair("hl-"+el.dataset.n,"note-"+el.dataset.n);return;
    case "kb-newfolder":{const nm=prompt("新文件夹名称：","新文件夹");if(nm){const n={id:uid(),type:"folder",name:nm.trim()||"新文件夹",children:[]};targetChildren().push(n);state.kbSel=n.id;state.expanded.add(n.id);saveDraft();renderKB();}return;}
    case "kb-newfile":{const nm=prompt("新文件名称：","新文件");if(nm){const n={id:uid(),type:"file",name:nm.trim()||"新文件",tags:[],body:"",notes:[]};targetChildren().push(n);state.kbSel=n.id;state.editingFile=true;state.fileBuf={name:n.name,tags:[],body:"",notes:[]};saveDraft();renderKB();}return;}
    case "kb-import":$("#importInput").click();return;
    case "kb-rename":{const l=locate(id);if(l){const nm=prompt("重命名：",l.node.name);if(nm){l.node.name=nm.trim()||l.node.name;saveDraft();renderKB();}}return;}
    case "kb-move":openMove(id);return;
    case "move-pick":{if(state.moving){moveNode(state.moving,el.dataset.target);state.kbSel=state.moving;state.moving=null;saveDraft();closeModals();renderKB();toast("已移动");}return;}
    case "kb-hide":{const l=locate(id);if(l){l.node.hidden=!l.node.hidden;saveDraft();renderKB();}return;}
    case "kb-download":{const l=locate(id);if(l&&l.node.type==="file"){const blob=new Blob([l.node.body||""],{type:"text/markdown"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(l.node.name||"文档")+".md";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("已下载");}return;}
    case "kb-delete":{const l=locate(id);if(l&&confirm("删除「"+l.node.name+"」"+(l.node.type==="folder"?"及其全部内容":"")+"？")){l.parent.splice(l.index,1);state.kbSel=firstFile();state.editingFile=false;saveDraft();renderKB();}return;}
    case "kb-edit":{const l=locate(id);if(l){state.editingFile=true;state.fileBuf={name:l.node.name,tags:(l.node.tags||[]).slice(),body:l.node.body||"",notes:(l.node.notes||[]).map(n=>({text:n.text}))};renderKB();}return;}
    case "kbedit-note-add":captureFileBuf();state.fileBuf.notes.push({text:""});renderKB();return;
    case "kbedit-note-del":captureFileBuf();state.fileBuf.notes.splice(+el.dataset.i,1);renderKB();return;
    case "kbedit-cancel":state.editingFile=false;state.fileBuf=null;renderKB();return;
    case "kbedit-save":{captureFileBuf();const l=locate(id);if(l){l.node.name=state.fileBuf.name.trim()||l.node.name;l.node.tags=state.fileBuf.tags;l.node.body=state.fileBuf.body;l.node.notes=state.fileBuf.notes.filter(n=>(n.text||"").trim());}state.editingFile=false;state.fileBuf=null;saveDraft();renderKB();toast("已保存");return;}

    case "fav-folder":state.favFolder=+el.dataset.i;state.favItem=null;renderFav();return;
    case "fav-open":state.favItem=+el.dataset.i;renderFav();window.scrollTo(0,0);return;
    case "fav-back":state.favItem=null;renderFav();return;
    case "fav-add-open":openAddFav();return;
    case "fav-newfolder":{const nm=prompt("新收藏夹名称：","新收藏夹");if(nm){DATA.fav.push({name:nm.trim()||"新收藏夹",cover:"⭐",items:[]});state.favFolder=DATA.fav.length-1;saveDraft();renderFav();}return;}
    case "fav-folder-rename":{const f=DATA.fav[+el.dataset.i];if(f){const nm=prompt("重命名收藏夹：",f.name);if(nm){f.name=nm.trim()||f.name;saveDraft();renderFav();}}return;}
    case "fav-folder-hide":{const f=DATA.fav[+el.dataset.i];if(f){f.hidden=!f.hidden;saveDraft();renderFav();}return;}
    case "fav-folder-del":{if(confirm("删除整个收藏夹及其内容？")){DATA.fav.splice(+el.dataset.i,1);state.favFolder=0;saveDraft();renderFav();}return;}
    case "fav-item-hide":{const it=DATA.fav[state.favFolder].items[+el.dataset.i];if(it){it.hidden=!it.hidden;saveDraft();renderFav();}return;}
    case "fav-item-del":{if(confirm("删除这条收藏？")){DATA.fav[state.favFolder].items.splice(+el.dataset.i,1);saveDraft();renderFav();}return;}
  }
});

document.addEventListener("submit",e=>{
  const f=e.target.closest('[data-action="feed-comment"]');if(!f)return;e.preventDefault();
  const id=f.dataset.id,inp=f.querySelector("input"),text=(inp.value||"").trim();if(!text)return;
  (store.cmts[id]=store.cmts[id]||[]).push({name:"访客",text,when:"刚刚"});saveStore();renderFeed();
});

$("#importInput").addEventListener("change",e=>{
  const files=[...e.target.files];if(!files.length)return;const target=targetChildren();let last=null,pend=files.length;
  files.forEach(file=>{const rd=new FileReader();rd.onload=()=>{const n={id:uid(),type:"file",name:file.name.replace(/\.(md|markdown|txt)$/i,""),tags:[],body:String(rd.result||""),notes:[]};target.push(n);last=n.id;if(--pend===0){state.kbSel=last;state.editingFile=false;saveDraft();renderKB();toast("已导入 "+files.length+" 个文件");}};rd.readAsText(file);});
  e.target.value="";
});

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("active",b.dataset.view===state.view));
  if(state.view==="feed")renderFeed();else if(state.view==="kb")renderKB();else renderFav();
}
async function boot(){
  await loadData();ensureIds();
  if(!DATA.profile)DATA.profile={name:"我",avatar:"🙂"};
  state.expanded=new Set();(function w(nodes){nodes.forEach(n=>{if(n.type==="folder"){state.expanded.add(n.id);w(n.children||[]);}});})(DATA.kb);
  if(!state.kbSel||!locate(state.kbSel))state.kbSel=firstFile();
  if(ownerUnlocked)$("#editBtn").style.display="";
  updateBar();render();
}
boot();
</script>
