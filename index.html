<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" id="favicon" href="assets/avatar.jpg" />
<link rel="apple-touch-icon" id="touchicon" href="assets/avatar.jpg" />
<title>秋渡的空间 · 动态 / 知识库 / 收藏</title>

<!--
  ============================================================
   个人空间 —— 动态 / 知识库 / 收藏，单文件 + data.json
  ------------------------------------------------------------
   · 访客：只读，看不到编辑入口
   · 站主：打开带 #edit 的网址，填入对本仓库有写权限的 GitHub 令牌（向 GitHub 校验）后解锁编辑；
           每次打开都会重新校验，令牌失效或被清除即自动上锁
           可 发帖/编辑/删除/隐藏、导入文件、改文件夹结构、
           重命名、隐藏、下载；改完可「发布」到线上或「导出」备份
   · 内容源 = data.json（发布即写回 GitHub）；离线时用内置 SEED
  ============================================================
-->

<style>
  /* ===== 设计令牌 =====
     个性：炭灰 + 单一青色高光 + 细线装饰；直角（2px）全局统一，只有头像是圆
     灰阶微暖 9 级、主色青（色相 196°）多级；阴影 5 级双层；间距 4/8/12/16/24/32/48/64；
     字号 12/14/16/18/20/24/30；动效 120/200/320ms，统一缓出曲线 */
  :root{
    --g0:#fafaf8;--g50:#f3f3f0;--g100:#e9e9e5;--g200:#dfdfda;--g300:#cbcbc5;--g400:#a5a6a2;
    --g500:#7d7f83;--g600:#55575c;--g700:#3d3f44;--g900:#17181b;
    --a50:#eaf6fa;--a100:#d3edf6;--a300:#6ec1de;--a500:#0e8fbc;--a700:#095f7e;
    --bg:var(--g100);--bg-soft:var(--g200);--card:var(--g0);
    --text:var(--g900);--text-soft:var(--g600);--text-dim:#66686d;
    --line:var(--g300);--line-s:var(--g200);
    --accent:var(--a500);--accent-so:var(--a50);--on-accent:#fff;
    --ink:var(--g900);--on-ink:var(--g0);
    --like:#c0344d;--danger:#b3372c;--ok:#2c7a45;
    --sh1:0 1px 2px rgba(23,24,27,.06),0 1px 3px rgba(23,24,27,.05);
    --sh2:0 2px 4px rgba(23,24,27,.05),0 8px 20px rgba(23,24,27,.08);
    --sh3:0 3px 6px rgba(23,24,27,.06),0 14px 32px rgba(23,24,27,.12);
    --sh4:0 6px 12px rgba(23,24,27,.08),0 28px 64px rgba(23,24,27,.18);
    --sh5:0 10px 20px rgba(23,24,27,.10),0 40px 90px rgba(23,24,27,.24);
    --shadow:var(--sh2);
    --inset:inset 0 1px 2px rgba(23,24,27,.07);
    --r:2px;
    --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;
    --d1:120ms;--d2:200ms;--d3:320ms;
    --e-out:cubic-bezier(.2,.8,.2,1);--e-io:cubic-bezier(.45,0,.2,1);
    --mono:"SF Mono","JetBrains Mono","Cascadia Code",ui-monospace,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",Roboto,Helvetica,Arial,sans-serif;
    --display:"Bahnschrift","DIN Alternate","Oswald",var(--sans);
  }
  :root[data-theme="dark"]{
    --bg:#1c1d20;--bg-soft:#161719;--card:#2a2c30;
    --text:#dcdcd8;--text-soft:#a9abb0;--text-dim:#8b8d93;--text-hi:#f2f2f0;
    --line:#393b41;--line-s:#303237;
    --accent:#45bde3;--accent-so:#123039;--on-accent:#06212b;
    --ink:#ecece9;--on-ink:#1e1f22;
    --like:#ff5c78;--danger:#ff6b6b;--ok:#51cf66;
    --sh1:0 0 0 1px rgba(255,255,255,.05),inset 0 1px 0 rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.30),0 1px 3px rgba(0,0,0,.20);
    --sh2:0 0 0 1px rgba(255,255,255,.07),inset 0 1px 0 rgba(255,255,255,.06),0 2px 4px rgba(0,0,0,.28),0 8px 20px rgba(0,0,0,.32);
    --sh3:0 3px 6px rgba(0,0,0,.30),0 14px 32px rgba(0,0,0,.40);
    --sh4:0 6px 12px rgba(0,0,0,.34),0 28px 64px rgba(0,0,0,.50);
    --sh5:0 10px 20px rgba(0,0,0,.38),0 40px 90px rgba(0,0,0,.58);
    --inset:inset 0 1px 2px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);
    line-height:1.75;letter-spacing:.01em;-webkit-font-smoothing:antialiased;transition:background var(--d3) var(--e-out),color var(--d3) var(--e-out)}
  a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
  button,textarea,input,select{font-family:inherit}

  /* 视口右侧的竖向细线（装饰） */
  body::after{content:"";position:fixed;top:0;bottom:0;
    right:20vw;
    width:1px;background:var(--line);opacity:.6;pointer-events:none;z-index:1}
  @media(max-width:1080px){body::after{display:none}}
  /* 横分割线：固定在视口，距底部 1/5；青色段会滑到当前板块下方 */
  .hline{position:fixed;left:0;right:0;bottom:16.6667vh;height:1px;z-index:1;pointer-events:none;
    background:color-mix(in srgb,var(--line) 60%,transparent)}
  .hline-mark{position:absolute;top:-1px;left:0;height:3px;width:280px;background:var(--accent);
    transform:translateX(22px);will-change:transform}
  @media(max-width:1080px){.hline{display:none}}

  /* 通用微标签：大写拉丁 + 宽字距 + 青色短杠 */
  .ph-title{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-weight:700;text-transform:uppercase;color:var(--text-dim)}
  .ph-title::before{content:"";width:14px;height:2px;background:var(--accent);flex:none}

  /* ===== 顶栏 ===== */
  header.site{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:saturate(1.2) blur(14px);-webkit-backdrop-filter:saturate(1.2) blur(14px);
    border-bottom:1px solid var(--line)}
  .site-row{max-width:1240px;margin:0 auto;padding:0 22px;height:62px;display:flex;align-items:center;gap:20px;position:relative}
  .site-row::after{content:"";position:absolute;left:22px;bottom:-1px;width:56px;height:2px;background:var(--accent)}
  .brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:18px;
    letter-spacing:.06em;color:var(--text);cursor:pointer;white-space:nowrap}
  .brand:hover{text-decoration:none}
  .brand .dot{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--text-dim)}
  .brand .dot::before{content:"// "}
  nav.tabs{display:flex;gap:2px}
  nav.tabs button{position:relative;border:0;background:transparent;cursor:pointer;padding:9px 16px;font-size:14px;letter-spacing:.04em;transition:color var(--d2) var(--e-out)}
  nav.tabs button:hover{color:var(--text)}
  
  nav.tabs button.active::after{content:"";position:absolute;left:16px;right:16px;bottom:2px;height:2px;background:var(--accent)}
  .spacer{flex:1}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 13px;gap:6px;
    border-radius:var(--r);border:1px solid var(--line);background:transparent;color:var(--text-soft);
    cursor:pointer;font-size:14px;font-weight:600;letter-spacing:.04em;transition:all var(--d2) var(--e-out)}
  .icon-btn.sq{width:34px;padding:0;font-family:var(--display);font-weight:700;
    font-size:14px;letter-spacing:.04em}
  .icon-btn:hover{color:var(--text);border-color:var(--text-dim)}
  .icon-btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

  /* ===== 编辑工具条 ===== */
  .toolbar{position:sticky;top:62px;z-index:35;background:var(--bg-soft);
    border-bottom:1px solid var(--line);display:none}
  body.editing .toolbar{display:block}
  .toolbar-row{max-width:1240px;margin:0 auto;padding:10px 22px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:14px}
  .tb-state{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--text-dim)}
  .tb-state .dot{width:6px;height:6px;background:var(--text-dim);transform:rotate(45deg)}
  .tb-state.dirty{color:var(--accent)}.tb-state.dirty .dot{background:var(--accent)}

  main{max-width:1240px;margin:0 auto;padding:30px 22px 100px}

  /* ===== 按钮 ===== */
  .btn{border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);border-radius:var(--r);font-size:14px;cursor:pointer;white-space:nowrap}
  
  .btn.sm{font-size:12px}
  .btn.ghost{background:transparent;color:var(--text-soft);border-color:var(--line)}
  .btn.ghost:hover{color:var(--text);border-color:var(--text-dim)}
  .btn.soft{background:transparent;color:var(--text-soft);border-color:var(--line)}
  .btn.soft:hover{color:var(--text);border-color:var(--text-dim)}
  .btn.danger{color:var(--danger)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .mini{border:1px solid var(--line);background:transparent;color:var(--text-dim);cursor:pointer;font-size:12px;letter-spacing:.03em;padding:4px 10px;border-radius:var(--r)}
  .mini:hover{color:var(--text);border-color:var(--text-dim)}
  .mini.danger:hover{color:var(--danger);border-color:var(--danger)}
  .hbadge{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:var(--text-dim);border:1px solid var(--line);padding:2px 7px}

  /* ===== 面板 ===== */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}

  /* ===== 动态 ===== */
  .feed{max-width:660px;margin:0 auto}
  .feed-h{margin:0 0 26px;padding-bottom:16px;border-bottom:1px solid var(--line);position:relative}
  .feed-h::after{content:"";position:absolute;left:0;bottom:-1px;width:40px;height:2px;background:var(--accent)}
  .feed-h h1{margin:0 0 5px;font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.04em}
  .feed-h p{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim)}

  .composer{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:20px}
  .composer textarea{width:100%;min-height:84px;border:1px solid var(--line);background:var(--bg-soft);border-radius:var(--r);
    padding:12px 14px;font-size:16px;color:var(--text);outline:0;resize:vertical;line-height:1.7}
  .composer textarea:focus{border-color:var(--accent)}
  .composer .row2{display:flex;gap:9px;margin-top:11px;align-items:center}
  .composer .row2 input{flex:1;border:1px solid var(--line);background:var(--bg-soft);border-radius:var(--r);
    padding:8px 12px;font-size:14px;color:var(--text);outline:0}
  .composer .row2 input:focus{border-color:var(--accent)}

  .post{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:20px 22px;margin-bottom:14px;transition:border-color var(--d2) var(--e-out),box-shadow var(--d2) var(--e-out)}
  .post::before{content:"";position:absolute;left:-1px;top:-1px;width:10px;height:10px;
    border-left:2px solid var(--accent);border-top:2px solid var(--accent);opacity:0;transition:opacity var(--d2) var(--e-out)}
  .post:hover::before{opacity:1}
  .post:hover{border-color:var(--text-dim);box-shadow:var(--shadow)}
  .post.hidden-item{opacity:.5;border-style:dashed}
  .post .top{display:flex;align-items:center;gap:12px;margin-bottom:13px}
  .avatar{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:700;background:var(--bg-soft);color:var(--text-soft);border:1px solid var(--line);overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  .post .who{font-weight:700;font-size:14px;letter-spacing:.02em}
  .post .when{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--text-dim)}
  .post .body{font-size:16px;cursor:pointer}.post .body p{margin:0 0 .75em}
  .post .body p:last-child{margin-bottom:0}
  .post .body .clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}

  /* 配图：单张居中按原比例；2/4 张两列居中对称；其余每行 3 张，最多 3 行，超出在第 9 格显示 +N */
  .imgs{display:grid;gap:5px;margin:14px auto 2px;grid-template-columns:repeat(3,minmax(0,1fr))}
  .imgs.two{grid-template-columns:repeat(2,minmax(0,1fr));max-width:440px}
  .imgs .ph{position:relative;aspect-ratio:1;border-radius:var(--r);background:var(--bg-soft);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--text-dim);overflow:hidden}
  .imgs .ph img{width:100%;height:100%;object-fit:cover;transition:transform var(--d3) var(--e-out)}
  .imgs .ph.zoom{cursor:zoom-in}.imgs .ph.zoom:hover img{transform:scale(1.03)}
  .imgs.one{display:block;text-align:center}
  .imgs.one .ph.zoom{display:contents}
  .imgs.one .ph.zoom img{display:inline-block;vertical-align:top;width:auto;height:auto;max-width:100%;max-height:440px;
    border:1px solid var(--line);border-radius:var(--r);background:var(--bg-soft)}
  .imgs.one .ph.zoom:hover img{transform:none}
  .imgs.one .ph:not(.zoom){display:inline-flex;width:160px}
  .imgs .more{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:rgba(10,11,13,.55);color:#fff;font-family:var(--display);font-size:30px;letter-spacing:.04em}
  .imgs .more:hover{background:rgba(10,11,13,.68)}
  .imgs-less{display:block;margin:8px auto 0;border:0;background:transparent;color:var(--text-dim);cursor:pointer;
    font-family:var(--mono);font-size:12px;letter-spacing:.12em}
  .imgs-less:hover{color:var(--text)}

  /* 配图查看器：左图右文 */
  .pv-bg{position:fixed;inset:0;z-index:90;background:rgba(8,9,11,.78);display:flex;align-items:center;justify-content:center;
    padding:24px;animation:lbin var(--d2) var(--e-out);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .pv{display:flex;width:min(1180px,100%);height:min(88vh,820px);background:var(--card);overflow:hidden}
  .pv-media{position:relative;flex:1 1 auto;min-width:0;background:#141517;display:flex;align-items:center;justify-content:center;user-select:none}
  .pv-media img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .pv-count{position:absolute;top:14px;right:14px;padding:3px 11px;background:rgba(0,0,0,.42);color:#fff;font-family:var(--mono);font-size:12px;letter-spacing:.06em}
  .pv-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;
    background:rgba(255,255,255,.82);color:#17181a;cursor:pointer;display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity var(--d2) var(--e-out);box-shadow:0 2px 10px rgba(0,0,0,.25)}
  .pv-media:hover .pv-nav{opacity:1}.pv-nav.prev{left:14px}.pv-nav.next{right:14px}
  .pv-dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:7px}
  .pv-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45);cursor:pointer}
  .pv-dots i.on{background:#fff}
  .pv-side{width:400px;flex:none;display:flex;flex-direction:column;border-left:1px solid var(--line);min-height:0}
  .pv-head{display:flex;align-items:center;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line-s)}
  .pv-head .who{font-weight:700;font-size:16px}
  .pv-scroll{flex:1;overflow:auto;padding:18px 22px}
  .pv-text{font-size:16px;line-height:1.8}.pv-text p{margin:0 0 .75em}
  .pv-date{font-family:var(--mono);font-size:12px;color:var(--text-dim);letter-spacing:.06em;margin-top:12px;
    padding-bottom:16px;border-bottom:1px solid var(--line-s)}
  .pv-ctitle{font-size:14px;color:var(--text-dim);margin:16px 0 14px}
  .pv-foot{border-top:1px solid var(--line-s);padding:12px 18px;display:flex;align-items:center;gap:14px}
  .pv-foot .cmt-form{flex:1;margin:0}
  .pv-foot .cmt-form input{min-width:0}
  .pv-foot .cmt-form input.nick{flex:0 0 76px;width:76px}
  .pv-foot .cmt-form input.site{flex:0 0 76px;width:76px}
  .pv-close{position:fixed;top:18px;right:20px;width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;
    background:rgba(255,255,255,.14);color:#fff;font-size:24px;line-height:40px;padding:0;z-index:2}
  .pv-close:hover{background:rgba(255,255,255,.26)}
  @media(max-width:760px){
    .pv-bg{padding:0}.pv{flex-direction:column;height:100%;border-radius:0}
    .pv-media{flex:0 0 52vh}.pv-side{width:auto;flex:1;border-left:0}.pv-nav{opacity:1;width:34px;height:34px}
    .pv-close{top:10px;right:10px;background:rgba(0,0,0,.45)}.pv-count{right:auto;left:14px}
  }
  .imgbuf{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
  .imgbuf .ib{position:relative;width:72px;height:72px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg-soft);
    display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}
  .imgbuf .ib img{width:100%;height:100%;object-fit:cover}
  .imgbuf .ib button{position:absolute;top:2px;right:2px;width:20px;height:20px;border:0;border-radius:50%;
    background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:20px;padding:0;cursor:pointer}

  .actions{display:flex;gap:20px;margin-top:16px;padding-top:13px;border-top:1px solid var(--line-s);align-items:center}
  .act{display:inline-flex;align-items:center;gap:7px;color:var(--text-dim);cursor:pointer;font-size:12px;
    font-family:var(--mono);letter-spacing:.06em;border:0;background:transparent;transition:color var(--d2) var(--e-out);padding:0}
  .act:hover{color:var(--text)}.act.liked{color:var(--like)}.act svg{width:16px;height:16px}
  .act.liked svg{fill:var(--like);stroke:var(--like)}
  .pop{animation:pop var(--d3) var(--e-out)}@keyframes pop{0%{transform:scale(.8)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
  .edit-actions{display:flex;gap:6px;margin-left:auto;align-items:center}

  .comments{margin-top:16px;padding-top:15px;border-top:1px solid var(--line-s)}
  .cmt{display:flex;gap:11px;margin-bottom:13px}.cmt .avatar{width:30px;height:30px;font-size:12px}
  .cmt .c-main{flex:1;min-width:0}.cmt .c-name{font-size:14px;font-weight:700}
  .cmt .c-name span{font-family:var(--mono);font-weight:400;color:var(--text-dim);margin-left:8px;font-size:12px;letter-spacing:.06em}
  .cmt .c-text{font-size:14px;margin-top:2px;word-wrap:break-word}
  .cmt-form{display:flex;gap:9px;margin-top:8px}
  .cmt-form input.nick{flex:0 0 96px;width:96px}
  .cmt-form input.site{flex:0 0 120px;width:120px}
  a.avatar.c-site{position:relative;overflow:hidden;text-decoration:none;color:inherit;cursor:pointer}
  a.avatar.c-site img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--card)}
  a.avatar.c-site:hover{box-shadow:0 0 0 2px var(--accent)}
  .cmt .c-row{display:flex;align-items:flex-start;gap:10px}
  .cmt .c-row .c-text{flex:1;min-width:0}
  .c-like{display:inline-flex;align-items:center;gap:4px;flex:none;border:0;background:transparent;cursor:pointer;padding:2px 0;
    color:var(--text-dim);font-family:var(--mono);font-size:12px;transition:color var(--d2) var(--e-out)}
  .c-like svg{width:14px;height:14px}.c-like:hover{color:var(--text)}
  .c-like.liked{color:var(--like)}.c-like.liked svg{fill:var(--like);stroke:var(--like)}
  .c-reply{margin-left:8px;border:0;background:transparent;cursor:pointer;padding:0;color:var(--text-dim);font-family:var(--sans);font-size:12px;font-weight:400}
  .c-reply:hover{color:var(--accent)}
  .c-owner{margin-left:6px;padding:0 5px;border:1px solid var(--accent);color:var(--accent);border-radius:var(--r);font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:0}
  .c-to{color:var(--accent);margin-right:4px}
  .c-replies{margin:8px 0 0;padding-left:12px;border-left:1px solid var(--line)}
  .c-replies .cmt{margin-bottom:9px}.c-replies .cmt .avatar{width:24px;height:24px;font-size:11px}
  .cmt-replying{display:flex;align-items:center;gap:8px;margin:8px 0 -2px;font-size:12px;color:var(--text-dim)}
  .cmt-replying button{border:0;background:transparent;color:var(--text-dim);cursor:pointer;padding:0;font-size:12px}.cmt-replying button:hover{color:var(--text)}
  .c-del{margin-left:8px;border:0;background:transparent;cursor:pointer;padding:0;color:var(--danger);
    font-family:var(--sans);font-size:12px;font-weight:400;opacity:.8}.c-del:hover{opacity:1;text-decoration:underline}
  .cmt-form input{flex:1;border:1px solid var(--line);background:var(--bg-soft);border-radius:var(--r);
    padding:9px 13px;font-size:14px;color:var(--text);outline:0}
  .cmt-form input:focus{border-color:var(--accent)}

  .backlink{display:inline-flex;align-items:center;gap:7px;margin:0 0 22px;color:var(--text-dim);
    font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    cursor:pointer;border:0;background:transparent;padding:0;transition:color var(--d2) var(--e-out)}
  .backlink:hover{color:var(--accent)}

  .inline-editor textarea{width:100%;min-height:130px;border:1px solid var(--accent);background:var(--bg-soft);
    border-radius:var(--r);padding:12px 14px;font-size:16px;color:var(--text);outline:0;resize:vertical}
  .inline-editor .row2{display:flex;gap:9px;margin-top:10px}
  .inline-editor .row2 input{flex:1;border:1px solid var(--line);background:var(--bg-soft);border-radius:var(--r);
    padding:8px 12px;font-size:14px;color:var(--text);outline:0}

  /* ===== 知识库 ===== */
  .kb{display:grid;grid-template-columns:246px minmax(0,1fr) 250px;gap:22px;align-items:start}
  .kb-tree{position:sticky;top:82px;padding:14px 10px;max-height:calc(100vh - 110px);overflow:auto}
  body.editing .kb-tree{top:124px}
  .kb-tree .ph-title{padding:4px 8px 12px}
  .tree-tools{display:flex;gap:4px;padding:0 6px 10px;flex-wrap:wrap}
  .tree-tools button{flex:1;min-width:0;border:1px solid var(--line);background:transparent;color:var(--text-dim);
    cursor:pointer;font-size:12px;padding:6px 4px;border-radius:var(--r);transition:all var(--d2) var(--e-out);white-space:nowrap}
  .tree-tools button:hover{border-color:var(--accent);color:var(--accent)}
  .node .row{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:var(--r);cursor:pointer;
    font-size:14px;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    border-left:2px solid transparent;transition:all var(--d1) var(--e-out)}
  .node .row:hover{background:var(--bg-soft);color:var(--text)}
  .node .row.sel{background:var(--bg-soft);color:var(--text);font-weight:700;border-left-color:var(--accent)}
  .node .row .ic{width:12px;text-align:center;flex:none;font-size:9px;color:var(--text-dim);font-family:var(--mono)}
  .node .row.sel .ic{color:var(--accent)}
  .node .row.hidden-item{opacity:.45}
  .node .row .eye{margin-left:auto;font-family:var(--mono);font-size:12px;letter-spacing:.1em;opacity:.7}

  .kb-main{position:relative}
  .kb-main::before{content:"";position:absolute;right:-1px;top:-1px;width:12px;height:12px;
    border-right:2px solid var(--accent);border-top:2px solid var(--accent)}
  .crumb{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--text-dim);margin-bottom:12px}
  .crumb .dot{opacity:.5;margin:0 5px}
  .kb-main h1.doc{font-family:var(--display);font-weight:700;letter-spacing:.03em}
  .doc-meta{font-size:12px;color:var(--text-dim)}
  .doc-meta .t{font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase}
  .doc-tools{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 26px;padding-bottom:22px;border-bottom:1px solid var(--line-s)}
  .folder-list{list-style:none;padding:0;margin:18px 0 0}
  .folder-list li{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);
    border-radius:var(--r);margin-bottom:7px;cursor:pointer;font-size:14px;transition:all var(--d2) var(--e-out)}
  
  .folder-list li .ic{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--text-dim);
    border:1px solid var(--line);padding:1px 6px;flex:none}

  .kb-notes{position:sticky;top:82px;max-height:calc(100vh - 110px);overflow:auto}
  body.editing .kb-notes{top:124px}
  .kb-notes .ph-title{margin-bottom:14px}
  .sticky{border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:var(--r);padding:12px 13px;font-size:14px;line-height:1.65;color:var(--text-soft);margin-bottom:10px;cursor:pointer;transition:all var(--d2) var(--e-out)}
  .sticky:hover{color:var(--text);border-color:var(--accent)}
  .sticky .n{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;
    font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);
    border:1px solid var(--accent);margin-right:8px}
  .kb-notes .hint{font-size:12px;color:var(--text-dim);line-height:1.7}
  mark.hl{background:color-mix(in srgb,var(--accent) 16%,transparent);color:inherit;
    border-bottom:1px solid var(--accent);padding:.05em .1em;cursor:pointer;
    box-decoration-break:clone;-webkit-box-decoration-break:clone;transition:background var(--d2) var(--e-out)}
  mark.hl:hover,mark.hl.flash{background:color-mix(in srgb,var(--accent) 38%,transparent)}
  .sticky.flash{border-color:var(--accent);background:var(--accent-so);color:var(--text)}

  .doc-editor label{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--text-dim);font-weight:700;margin:16px 0 7px}
  .doc-editor input.f,.doc-editor textarea.f{width:100%;border:1px solid var(--line);background:var(--bg-soft);
    border-radius:var(--r);padding:10px 13px;font-size:14px;color:var(--text);outline:0}
  .doc-editor input.f:focus,.doc-editor textarea.f:focus{border-color:var(--accent)}
  .doc-editor textarea.body{min-height:360px;font:14px/1.75 var(--mono);resize:vertical}
  .note-edit{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
  /* 富文本编辑 */
  .kb-tb{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:0 0 10px;padding:6px 0;position:sticky;top:-26px;z-index:3;background:var(--card)}
  .kb-tb button{min-width:32px;height:30px;padding:0 9px;border:1px solid var(--line);background:transparent;color:var(--text-soft);
    border-radius:var(--r);cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all var(--d1) var(--e-out)}
  .kb-tb button:hover{border-color:var(--accent);color:var(--text)}
  .kb-tb button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .kb-tb .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
  .kb-tb .sw{width:14px;height:14px;border-radius:2px;display:block}
  .kb-tb .sw.y{background:#ffd84d}.kb-tb .sw.r{background:#ff6b6b}
  .kb-tb .tb-note{font-size:12px}
  .rte{min-height:360px;border:1px solid var(--line);background:var(--bg-soft);border-radius:var(--r);padding:16px 18px;outline:0;margin-bottom:18px}
  .rte:focus{border-color:var(--accent)}
  .rte>:first-child{margin-top:0}
  .md mark.y{background:rgba(255,206,0,.4);color:inherit;padding:0 .05em}
  .md mark.r{background:rgba(255,70,70,.32);color:inherit;padding:0 .05em}
  .md u{text-underline-offset:3px}
  span.na{display:inline-block;width:0;height:1.15em;vertical-align:text-bottom}
  .rte span.na{width:2px;margin:0 1px;background:var(--accent)}
  #noteLines{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:40;overflow:visible}
  #noteLines path{fill:none;stroke:var(--accent);stroke-width:2;shape-rendering:crispEdges}
  .sticky.edit{display:flex;gap:6px;align-items:flex-start;cursor:text;position:relative;padding-right:26px}
  .sticky.edit textarea{flex:1;min-width:0;min-height:22px;border:0;background:transparent;resize:none;outline:0;padding:0;
    color:var(--text);font:inherit;line-height:1.65;overflow:hidden}
  .sticky.edit .x{position:absolute;top:8px;right:6px;border:0;background:transparent;color:var(--text-dim);cursor:pointer;font-size:12px;padding:2px 4px}
  .sticky.edit .x:hover{color:var(--danger)}
  .sticky.edit:focus-within{border-color:var(--accent);color:var(--text)}
  .note-edit textarea{flex:1;min-height:46px;border:1px solid var(--line);background:var(--bg-soft);
    border-radius:var(--r);padding:8px 11px;font-size:14px;color:var(--text);outline:0;resize:vertical}

  /* ===== 收藏 ===== */
  .fav{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;align-items:start}
  .fav-side{position:sticky;top:82px;padding:14px 10px}
  body.editing .fav-side{top:124px}
  .fav-side .ph-title{padding:4px 8px 12px}
  .folder{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r);cursor:pointer;
    border-left:2px solid transparent;transition:all var(--d1) var(--e-out)}
  .folder:hover{background:var(--bg-soft)}
  .folder.sel{background:var(--bg-soft);border-left-color:var(--accent)}
  .folder.hidden-item{opacity:.45}
  .folder .f-name{font-size:14px;font-weight:600;color:var(--text-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .folder.sel .f-name{color:var(--text);font-weight:700}
  .folder .f-count{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--text-dim);margin-top:1px}

  .fav-main-head{display:flex;align-items:center;gap:10px;margin-bottom:22px;padding-bottom:14px;
    border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative}
  .fav-main-head::after{content:"";position:absolute;left:0;bottom:-1px;width:40px;height:2px;background:var(--accent)}
  .fav-main-head h1{margin:0;font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.04em}
  .fav-grid{display:grid}
  .fcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
    transition:border-color var(--d2) var(--e-out),transform var(--d1) var(--e-out),box-shadow var(--d2) var(--e-out);position:relative}
  .fcard:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-2px)}
  .fcard.hidden-item{opacity:.5;border-style:dashed}
  .fcard .cover{aspect-ratio:16/10;position:relative;overflow:hidden;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .fcard .cover img{width:100%;height:100%;object-fit:cover}
  .fcard .src{position:absolute;font-family:var(--mono);font-weight:700;text-transform:uppercase}
  
  .fcard .info .t{font-size:14px;font-weight:600;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .fcard .info .u{font-family:var(--mono);color:var(--text-dim);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fcard .fedit{display:flex;gap:6px;padding:0 13px 12px}
  .embed-wrap{background:#000;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;margin-bottom:18px}
  .embed-wrap iframe{width:100%;height:100%;border:0;display:block}

  /* ===== 弹窗 / 提示 ===== */
  .modal-bg{position:fixed;inset:0;background:rgba(12,13,15,.62);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;width:100%;max-width:460px;max-height:88vh;overflow:auto;position:relative}
  .modal::before{content:"";position:absolute;left:-1px;top:-1px;width:14px;height:14px;
    border-left:2px solid var(--accent);border-top:2px solid var(--accent)}
  .modal h3{margin:0 0 6px;font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:.04em}
  .modal p.sub{margin:0 0 20px;color:var(--text-dim);font-size:12px;line-height:1.7}
  .field{margin-bottom:15px}
  .field label{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--text-dim);margin-bottom:7px;font-weight:700}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg-soft);
    border-radius:var(--r);padding:10px 13px;font-size:14px;color:var(--text);outline:0}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
  .modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
  .picklist{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
  .picklist button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line-s);
    background:transparent;color:var(--text);padding:10px 13px;font-size:14px;cursor:pointer}
  .picklist button:hover{background:var(--bg-soft);color:var(--accent)}
  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--on-ink);padding:11px 20px;border-radius:var(--r);font-size:14px;font-weight:600;letter-spacing:.02em;opacity:0;pointer-events:none;transition:all var(--d3) var(--e-out);z-index:80;max-width:90vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .empty{text-align:center;color:var(--text-dim);padding:70px 0;font-size:14px;line-height:1.9}

  /* ===== 正文排版 ===== */
  
  .md p{margin:0 0 1.1em}
  .md h1,.md h2,.md h3{font-family:var(--display);line-height:1.4;letter-spacing:.03em;margin:1.9em 0 .8em;font-weight:700}
  .md h1{font-size:24px}.md h2{font-size:20px}
  .md h2{padding-bottom:8px;border-bottom:1px solid var(--line-s);position:relative}
  .md h2::after{content:"";position:absolute;left:0;bottom:-1px;width:28px;height:2px;background:var(--accent)}
  .md h3{font-size:18px}
  .md ul,.md ol{margin:0 0 1.1em;padding-left:1.4em}.md li{margin:.35em 0}
  .md ul li::marker{color:var(--accent)}
  .md a{text-decoration:underline;text-underline-offset:3px}
  .md img{max-width:100%;border-radius:var(--r);border:1px solid var(--line)}
  .md hr{border:0;border-top:1px solid var(--line);margin:2.2em 0}
  .md blockquote{margin:0 0 1.1em;padding:4px 18px;color:var(--text-soft);border-left:2px solid var(--accent);
    background:var(--bg-soft);border-radius:0}
  .md blockquote p:last-child{margin-bottom:0}
  .md code{font:.87em/1.5 var(--mono);background:var(--bg-soft);padding:.16em .45em;border-radius:var(--r);border:1px solid var(--line-s)}
  .md pre{background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;
    overflow-x:auto;margin:0 0 1.3em;position:relative}
  .md pre code{background:none;border:0;padding:0;font-size:14px;line-height:1.75}
  .md table{border-collapse:collapse;width:100%;margin:0 0 1.3em;font-size:14px}
  .md th,.md td{border:1px solid var(--line);padding:9px 13px;text-align:left}
  .md th{background:var(--bg-soft);font-weight:700;font-family:var(--mono);font-size:12px;
    letter-spacing:.1em;text-transform:uppercase}

  @media(max-width:1080px){.kb{grid-template-columns:220px minmax(0,1fr)}.fav{grid-template-columns:220px minmax(0,1fr)}.rail{display:none}}
  @media(max-width:760px){
    .kb{grid-template-columns:1fr}.kb-tree{position:static;max-height:300px;margin-bottom:16px}
    .fav{grid-template-columns:1fr}.fav-side{position:static;margin-bottom:16px}
    nav.tabs button{padding:9px 11px;font-size:14px}
    .brand .dot{display:none}
    .kb-main{padding:24px 20px}
  }

  /* ===== 右侧栏（三个板块共用同一位置） ===== */
  .with-rail{display:grid;gap:24px;align-items:start}
  .feed-layout{grid-template-columns:minmax(0,1fr)}
  /* 右栏：固定在竖线右侧的 1/6 区域内 */
  .rail{position:fixed;right:0;top:78px;width:20vw;padding:0 14px;
    display:flex;flex-direction:column;gap:14px;overflow:visible;z-index:30}
  body.editing .rail{top:120px}
  @media(min-width:1081px){
    body{padding-right:20vw;overflow:hidden}          /* 整页不滚动 */
    .site-foot{display:none}
    /* 内容区上到顶栏、下到横分割线，内部滚动 */
    main{position:fixed;top:62px;left:0;right:20vw;bottom:16.6667vh;
      transition:top var(--d1) var(--e-out);
      max-width:none;margin:0;padding:26px 22px 20px;overflow-y:auto;overflow-x:hidden}
    main::-webkit-scrollbar{width:0;height:0}
    main{scrollbar-width:none}
    .kb-tree,.kb-notes,.fav-side{top:0;max-height:calc(83.3333vh - 108px)}
    /* 编辑模式下工具条占一行高度，内容区和右栏一起下移，避免被盖住 */
    body.editing main{top:var(--tbh,112px)}
    body.editing .rail{top:var(--tbh,112px);height:calc(83.3333vh - var(--tbh,112px) - 28px)}
    /* 知识库整体右移，使 DIRECTORY 左边缘与顶栏“秋”字对齐
       1196 = 顶栏内容宽 1240 减去 main 左右各 22 的内边距 */
    .kb,.fav{max-width:1196px;margin:0 auto}
    /* 右栏：内容用滚轮上下滑动（不裁剪，照片仍可拖出） */
    .rail{top:62px;height:calc(83.3333vh - 62px - 28px);overflow:visible;     /* 底部留 28px，照片墙不贴着城市 */
      clip-path:inset(0 -100vw 0 -100vw)}   /* 上下按框裁剪，左右放行到整屏以便拖动照片 */
    .rail-scroll{display:flex;flex-direction:column;gap:14px;
      transition:transform var(--d1) var(--e-out);will-change:transform}
    /* 动态：把正文推回整个页面的水平中心（内容区中心比页面中心左偏 10vw） */
    body[data-view="feed"] .feed{transform:translateX(10vw)}
  }
  .rail-box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .rail-box .ph-title{margin-bottom:14px}
  .rail-note{font-size:12px;color:var(--text-dim);line-height:1.7}

  /* ===== 照片墙 ===== */
  .photowall{display:flex;flex-direction:column;align-items:center}
  .photo{position:relative;width:100%;cursor:grab;touch-action:none;
    transform-origin:center center;will-change:transform}
  .photo{user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
  .photo:active{cursor:grabbing}
  .photo.dragging{z-index:60}
  .photo img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
  .photo:hover img{transform:scale(.985)}
  .photo.grabbing img{transform:scale(.95) rotate(-.6deg)}
  .photo.grabbing{cursor:grabbing}
  .photo .pdel{position:absolute;left:4px;top:4px;z-index:2;opacity:0;transition:opacity var(--d2) var(--e-out)}
  .photo:hover .pdel{opacity:1}
  .rail-bare{background:none;border:0;padding:0}
  .lightbox{position:fixed;inset:0;background:rgba(8,9,11,.72);z-index:95;display:flex;
    align-items:center;justify-content:center;cursor:zoom-out;animation:lbin .18s ease;
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  @keyframes lbin{from{opacity:0}to{opacity:1}}
  .lightbox img{width:92vw;height:92vh;object-fit:contain;box-shadow:0 24px 70px rgba(0,0,0,.6)}
  .lightbox.qr img{width:auto;height:auto;max-width:min(72vw,400px);max-height:min(72vh,400px);
    background:#fff;padding:14px;border-radius:4px}
  .lightbox .qr-missing{background:var(--card);border:1px solid var(--line);color:var(--text-soft);
    padding:26px 30px;border-radius:var(--r);font-size:14px;text-align:center;max-width:80vw}
  .lightbox .qr-tip{position:absolute;bottom:12%;font-family:var(--mono);font-size:12px;
    letter-spacing:.14em;text-transform:uppercase;color:#cfd2d6}

  /* ===== 贡献格 ===== */
  /* 格子为扁长方形：横向铺满、纵向压缩 */
  .cgrid-wrap{overflow:hidden;--ch:clamp(4px,calc((100vh - 280px)/53 - 2px),9px)}

  .cg-total{font-family:var(--mono);letter-spacing:.08em;color:var(--text-soft)}
  

  /* ===== 联系方式 ===== */
  
  .contact{position:relative;display:flex;align-items:center;text-decoration:none;cursor:pointer;overflow:hidden;transition:all var(--d2) var(--e-out)}
  .contact:hover{text-decoration:none}
  .contact img{width:100%;height:100%;object-fit:cover}
  .contact .mono{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.02em}
  .contact .mono.sm{letter-spacing:0;line-height:1.2;text-align:center}
  .contact svg{width:56%;height:56%;stroke:currentColor;fill:none;
    stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ===== 页面底部分割线 + 页脚 ===== */
  .site-foot{border-top:1px solid var(--line);margin-top:40px;position:relative}
  @media(min-width:1081px){.site-foot{border-top-color:transparent}.site-foot::after{display:none}}
  .site-foot::after{content:"";position:absolute;left:22px;top:-1px;width:56px;height:2px;background:var(--accent)}
  .foot-row{max-width:1240px;margin:0 auto;padding:10px 22px 17px;align-items:center;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim)}
  .foot-row .sep{opacity:.5}

  @media(max-width:1080px){
    .feed-layout{grid-template-columns:minmax(0,1fr)}
  }
  @media(max-width:760px){.rail{position:static}}

  /* ===================== 统一系统层 ===================== */
  /* 区块小标题 */
  .ph-title{font-size:12px;letter-spacing:.16em}
  .page-h{display:flex;gap:var(--s3);margin:0 0 var(--s5)}
  .page-h .cnt{font-family:var(--mono);font-size:12px;color:var(--text-dim)}
  /* 焦点 */
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input:focus-visible,textarea:focus-visible,select:focus-visible,[contenteditable]:focus-visible{outline:0}
  /* 输入：凹陷（顶部内影），聚焦加主色光圈 */
  .composer textarea,.composer .row2 input,.cmt-form input,.field input,.field select,.field textarea,
  .doc-editor input.f,.rte,.inline-editor textarea,.inline-editor .row2 input,.note-edit textarea,.cp-input{
    box-shadow:var(--inset);transition:border-color var(--d2) var(--e-out),box-shadow var(--d2) var(--e-out)}
  .composer textarea:focus,.composer .row2 input:focus,.cmt-form input:focus,.field input:focus,.field select:focus,.field textarea:focus,
  .doc-editor input.f:focus,.rte:focus,.inline-editor textarea:focus,.inline-editor .row2 input:focus{
    border-color:var(--accent);box-shadow:var(--inset),0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
  /* 卡片：比底色浅即凸起，去掉边框，用阴影分层 */
  .panel,.post,.fcard,.composer,.rail-box,.modal{border-color:transparent;box-shadow:var(--sh1)}
  .post,.fcard{transition:box-shadow var(--d2) var(--e-out),transform var(--d2) var(--e-out)}
  .post:hover,.fcard:hover{border-color:transparent;box-shadow:var(--sh2);transform:translateY(-2px)}
  .post.hidden-item,.fcard.hidden-item{border-color:var(--line)}
  .fcard .cover{border-bottom:0}
  .fcard .cover img{transition:transform var(--d3) var(--e-out)}
  .fcard:hover .cover img{transform:scale(1.03)}
  .folder-list li{border-color:transparent;background:var(--bg);box-shadow:none}
  .folder-list li:hover{border-color:transparent;background:var(--bg-soft)}
  .sticky{border-top-color:transparent;border-right-color:transparent;border-bottom-color:transparent}
  .sticky:hover{border-top-color:transparent;border-right-color:transparent;border-bottom-color:transparent;box-shadow:var(--sh1)}
  .contact{border-color:transparent}
  .contact:hover{border-color:transparent}
  /* 按钮金字塔：主操作实底 / 次操作描边 / 三级像链接；破坏性操作平时降级 */
  .btn{font-weight:600;padding:8px 16px;letter-spacing:.02em;box-shadow:var(--sh1);
    transition:opacity var(--d1) var(--e-out),box-shadow var(--d1) var(--e-out),transform var(--d1) var(--e-out),color var(--d1) var(--e-out),background-color var(--d1) var(--e-out),border-color var(--d1) var(--e-out)}
  .btn:hover{opacity:.9;box-shadow:var(--sh2)}
  .btn:active{transform:translateY(1px);box-shadow:none}
  .btn.sm{padding:4px 12px}
  .btn.soft,.btn.ghost{box-shadow:none}
  .btn.soft:hover,.btn.ghost:hover{opacity:1;box-shadow:none;background:var(--bg-soft)}
  .btn.link{border-color:transparent;background:transparent;color:var(--text-soft);box-shadow:none;padding-left:8px;padding-right:8px}
  .btn.link:hover{opacity:1;box-shadow:none;color:var(--text);background:var(--bg-soft)}
  .btn.danger{border-color:transparent;background:transparent;box-shadow:none}
  .btn.danger:hover{opacity:1;box-shadow:none;background:color-mix(in srgb,var(--danger) 10%,transparent)}
  .mini{transition:color var(--d1) var(--e-out),border-color var(--d1) var(--e-out)}
  .icon-btn svg{width:16px;height:16px}
  /* 顶栏：滑动指示条代替每个按钮各自的下划线 */
  nav.tabs{position:relative}
  nav.tabs button.active::after{display:none}
  .tab-ink{position:absolute;left:0;bottom:2px;height:2px;width:0;background:var(--accent);pointer-events:none;
    transition:transform var(--d3) var(--e-out),width var(--d3) var(--e-out)}
  /* 深度 */
  #toast{box-shadow:var(--sh3)}
  .modal{box-shadow:var(--sh4)}
  .pv{box-shadow:var(--sh5);border-radius:var(--r)}
  .pv-foot .cmt-form input{border-radius:var(--r)}
  .pv-count{border-radius:var(--r)}
  .photo:hover img{box-shadow:var(--sh2)}
  .photo.grabbing img{box-shadow:var(--sh5)}
  /* 进入 / 退出动效 */
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes popin{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
  .enter-i{animation:rise var(--d3) var(--e-out) both;animation-delay:calc(var(--i,0) * 35ms)}
  .modal-bg{animation:fade var(--d2) var(--e-out)}
  .modal{animation:popin var(--d3) var(--e-out)}
  .pv{animation:popin var(--d3) var(--e-out)}
  .modal-bg.out,.pv-bg.out,.cp-bg.out{animation:fade var(--d1) var(--e-io) reverse both}
  /* 正文阅读宽度 */
  .md{max-width:680px}
  .kb.no-notes{grid-template-columns:246px minmax(0,1fr)}
  .doc-meta{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s2)}
  .doc-meta .t{margin-right:0}
  .doc-meta .stat{font-family:var(--mono);font-size:12px;color:var(--text-dim)}
  /* 收藏详情 */
  .fav-detail h1{margin:0 0 var(--s1);font-size:20px;font-weight:700;line-height:1.4}
  .fav-detail .src{color:var(--text-dim);font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:var(--s4)}
  .embed-wrap{border-color:transparent;box-shadow:var(--sh2)}

  /* 动态左侧：资料 + 按月归档 */
  .feed-side{display:none}
  @media(min-width:1240px){
    .feed-side{display:block;position:fixed;top:88px;width:232px;left:max(16px,calc(50vw - 594px));z-index:2}
    body.editing .feed-side{top:calc(var(--tbh,112px) + 26px)}
  }
  .fs-card{border-radius:var(--r);margin-bottom:var(--s5);position:relative}
  .fs-card::before{content:"";position:absolute;left:0;top:0;width:32px;height:2px;background:var(--accent)}
  .fs-card .avatar{font-size:18px;border:0;box-shadow:0 0 0 3px var(--card),0 0 0 4px var(--line)}
  .fs-name{line-height:1.4}
  .fs-sub{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--text-dim)}
  .fs-stats{display:flex;margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--line-s);font-size:12px;color:var(--text-dim)}
  .fs-stats b{display:block;font-family:var(--display);color:var(--text);line-height:1.3}
  .fs-stats div{cursor:pointer;transition:color var(--d1) var(--e-out)}.fs-stats div:hover b{color:var(--accent)}
  .fs-arch{display:flex;flex-direction:column;gap:2px;margin-top:var(--s3)}
  .fs-arch button{display:flex;align-items:baseline;justify-content:space-between;border:0;background:transparent;cursor:pointer;
    padding:6px var(--s3);border-left:2px solid transparent;color:var(--text-soft);font-family:var(--mono);font-size:12px;letter-spacing:.06em;
    text-align:left;transition:background-color var(--d1) var(--e-out),color var(--d1) var(--e-out),border-color var(--d1) var(--e-out)}
  .fs-arch button span{color:var(--text-dim)}

  .fs-arch button.on{border-left-color:var(--accent);color:var(--text);font-weight:700}

  /* 底部信息带：横分割线以下 */
  .foot-band{max-width:1240px;margin:0 auto;padding:var(--s5) 22px;display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:var(--s6);align-items:start}
  .fb-cell{min-width:0;cursor:pointer}
  .fb-cell .ph-title{margin-bottom:var(--s2)}
  .fb-t{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:color var(--d1) var(--e-out)}

  .fb-cell:hover .fb-t{color:var(--accent)}
  .fb-meta{text-align:right;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--text-dim);line-height:1.9;white-space:nowrap}
  .fb-meta b{color:var(--text-soft);font-weight:600}
  @media(min-width:1081px){
    .site-foot{display:block;position:fixed;left:0;right:20vw;bottom:0;height:16.6667vh;margin:0;border:0;z-index:2;overflow:hidden}
  }
  @media(max-width:1080px){.foot-band{grid-template-columns:1fr 1fr;gap:var(--s5)}.fb-meta{text-align:left}}
  @media(max-width:560px){.foot-band{grid-template-columns:1fr}}
  .foot-row{display:none}

  /* 全站搜索 */
  .cp-bg{position:fixed;inset:0;z-index:85;background:rgba(12,13,15,.5);display:flex;justify-content:center;align-items:flex-start;
    padding:14vh var(--s4) var(--s4);animation:fade var(--d2) var(--e-out)}
  .cp{width:min(600px,100%);background:var(--card);border-radius:var(--r);box-shadow:var(--sh4);overflow:hidden;animation:popin var(--d3) var(--e-out);position:relative}
  .cp::before{content:"";position:absolute;left:0;top:0;width:32px;height:2px;background:var(--accent)}
  .cp-in{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4);border-bottom:1px solid var(--line-s)}
  .cp-in svg{width:18px;height:18px;flex:none;stroke:var(--text-dim);fill:none;stroke-width:2}
  .cp-input{flex:1;border:0;background:transparent;color:var(--text);font-size:16px;padding:var(--s4) 0;outline:0;box-shadow:none}
  .cp-in kbd{font-family:var(--mono);font-size:12px;color:var(--text-dim);border:1px solid var(--line);border-radius:var(--r);padding:0 6px}
  .cp-list{max-height:min(60vh,520px);overflow:auto;padding:var(--s2) 0}
  .cp-list:empty{display:none}
  .cp-g{padding:var(--s3) var(--s4) var(--s1)}
  .cp-it{display:block;padding:var(--s2) var(--s4);cursor:pointer;border-left:2px solid transparent}
  .cp-it.on{background:var(--bg-soft);border-left-color:var(--accent)}
  .cp-t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cp-s{font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .cp-it mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;padding:0 1px}
  .cp-none{padding:var(--s5) var(--s4);color:var(--text-dim);font-size:14px}

  /* 窄屏：标签换到第二行，整页不横向溢出 */
  @media(max-width:560px){
    .site-row{height:auto;flex-wrap:wrap;gap:0 var(--s2);padding:var(--s2) var(--s4) 0}

  /* ===== 第二轮：结构区不再套卡片，直接落在纸面上；卡片只留给内容 ===== */
  .kb-tree,.fav-side{background:transparent;box-shadow:none;padding-left:0;padding-right:0}
  
  .kb-notes{background:transparent;box-shadow:none;padding:var(--s4) 0}

  /* 文档页：标题更大、元数据去框、正文前留足间距、卡片高度随内容 */

<!-- ============================================================

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app=$("#app");
const uid=()=>"n"+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2600);}

const KEY_CACHE="myspace-cache";
const KEY_STORE="myspace-store",KEY_DRAFT="myspace-draft",KEY_GH="myspace-gh",KEY_OWNER="myspace-owner",KEY_THEME="ms-theme";
let store=(()=>{try{return JSON.parse(localStorage.getItem(KEY_STORE))||{}}catch(e){return{}}})();
store.likes=store.likes||{};store.cmts=store.cmts||{};store.cmtLikes=store.cmtLikes||{};
/* 旧评论补上 id，便于点赞和删除 */
Object.keys(store.cmts).forEach(k=>(store.cmts[k]||[]).forEach(c=>{if(!c.id)c.id=uid();}));
function saveStore(){try{localStorage.setItem(KEY_STORE,JSON.stringify(store))}catch(e){}}

let DATA={feed:[],kb:[],fav:[]};
let dirty=false;
function saveDraft(){dirty=true;try{localStorage.setItem(KEY_DRAFT,JSON.stringify(exportData()))}catch(e){}updateBar();}
function clearDraft(){dirty=false;try{localStorage.removeItem(KEY_DRAFT)}catch(e){}updateBar();}
function ghCfg(){let c;try{c=JSON.parse(localStorage.getItem(KEY_GH))}catch(e){}return Object.assign({owner:"AsamiAkito",repo:"knowledge-base",branch:"main",path:"data.json",token:""},c||{});}

const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
      MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);$("#themeBtn").innerHTML=t==="dark"?SUN:MOON;try{localStorage.setItem(KEY_THEME,t)}catch(e){}}
(function(){let t;try{t=localStorage.getItem(KEY_THEME)}catch(e){}if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";applyTheme(t);})();

/* 站主验证：#edit 只是入口；必须有对本仓库有写权限的 GitHub 令牌才解锁（本机没有令牌就一定是锁着的） */
let ownerUnlocked=false,wantUnlock=false;
(function(){try{
  if(location.hash.replace("#","").toLowerCase()==="edit"){wantUnlock=true;history.replaceState(null,"",location.pathname+location.search);}
  ownerUnlocked=localStorage.getItem(KEY_OWNER)==="1"&&!!ghCfg().token;
  if(!ownerUnlocked)localStorage.removeItem(KEY_OWNER);
}catch(e){}})();
/* 向 GitHub 校验：true = 有写权限；false = 令牌无效 / 无权限；null = 网络问题（不改变现状） */
async function verifyOwner(token){
  const c=ghCfg();
  try{const r=await fetch("https://api.github.com/repos/"+encodeURIComponent(c.owner)+"/"+encodeURIComponent(c.repo),{headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json"},cache:"no-store"});
    if(r.status===401||r.status===403||r.status===404)return false;if(!r.ok)return null;
    const j=await r.json();return !!(j.permissions&&(j.permissions.push||j.permissions.admin));}catch(e){return null;}
}
function lockOwner(){ownerUnlocked=false;try{localStorage.removeItem(KEY_OWNER)}catch(e){}if(state.editMode)setEdit(false);$("#editBtn").style.display="none";}
function unlockOwner(){ownerUnlocked=true;try{localStorage.setItem(KEY_OWNER,"1")}catch(e){}$("#editBtn").style.display="";}
function openUnlock(){
  const bg=modal('<h3>站主验证</h3><form id="ulForm"><div class="field"><label>GitHub 令牌</label><input name="token" type="password" autocomplete="off" required></div>'
    +'<div class="modal-actions"><button type="button" class="btn ghost" data-action="modal-close">取消</button><button type="submit" class="btn">解锁</button></div></form>');
  const form=bg.querySelector("#ulForm");form.querySelector("input").focus();
  form.addEventListener("submit",async e=>{e.preventDefault();const t=(new FormData(form).get("token")||"").trim();if(!t)return;
    const btn=form.querySelector("[type=submit]");btn.disabled=true;
    const ok=await verifyOwner(t);btn.disabled=false;
    if(ok){const c=ghCfg();c.token=t;localStorage.setItem(KEY_GH,JSON.stringify(c));unlockOwner();closeEl(bg);toast("已解锁编辑");}
    else toast(ok===false?"令牌无效或没有写权限":"网络不通，稍后再试");});
}

let state={view:"feed",feedOpen:null,kbSel:null,favFolder:0,favItem:null,expanded:new Set(),editMode:false,editingPost:null,editingFile:false,composerText:"",composerImgText:"",imgBuf:[],composerImgs:[],imgTarget:"c",imgsOpen:new Set(),pv:null,fmtOn:new Set(),feedMonth:"",moving:null,fileBuf:null};

let _hl=0;
function md(src){
  const blocks=[];
  src=(src||"").replace(/```(\w*)\n([\s\S]*?)```/g,function(_,l,c){blocks.push('<pre><code>'+esc(c.replace(/\n$/,""))+'</code></pre>');return "\nCBLK"+(blocks.length-1)+"CBLK\n";});
  const inline=t=>esc(t)
    .replace(/&lt;(\/?)u&gt;/g,"<$1u>").replace(/&lt;mark class=&quot;([yr])&quot;&gt;([\s\S]*?)&lt;\/mark&gt;/g,'<mark class="$1">$2</mark>')
    .replace(/==([^=]+)==/g,(_,x)=>{_hl++;return '<mark class="hl" id="hl-'+_hl+'" data-action="kb-hl" data-n="'+_hl+'">'+x+'</mark>';})
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img alt="$1" src="$2">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/`([^`]+)`/g,(_,c)=>"<code>"+c+"</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g,"<em>$1</em>");
  const lines=src.split("\n");let html="",i=0;
  const list=(tag,items)=>"<"+tag+">"+items.map(x=>"<li>"+inline(x)+"</li>").join("")+"</"+tag+">";
  const isBlock=s=>/^\s*(#{1,3}\s|>|[-*]\s|\d+\.\s|---\s*$)/.test(s)||/^CBLK\d+CBLK$/.test(s.trim())||/^\s*$/.test(s);
  while(i<lines.length){
    let ln=lines[i];let bm=ln.trim().match(/^CBLK(\d+)CBLK$/);
    if(bm){html+=blocks[+bm[1]];i++;continue;}
    if(/^\s*$/.test(ln)){i++;continue;}
    let m;
    if(m=ln.match(/^(#{1,3})\s+(.*)$/)){html+="<h"+m[1].length+">"+inline(m[2])+"</h"+m[1].length+">";i++;continue;}
    if(/^\s*---\s*$/.test(ln)){html+="<hr>";i++;continue;}
    if(/^\s*>\s?/.test(ln)){let b=[];while(i<lines.length&&/^\s*>\s?/.test(lines[i])){b.push(lines[i].replace(/^\s*>\s?/,""));i++;}html+="<blockquote>"+md(b.join("\n"))+"</blockquote>";continue;}
    if(/^\s*[-*]\s+/.test(ln)){let it=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){it.push(lines[i].replace(/^\s*[-*]\s+/,""));i++;}html+=list("ul",it);continue;}
    if(/^\s*\d+\.\s+/.test(ln)){let it=[];while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){it.push(lines[i].replace(/^\s*\d+\.\s+/,""));i++;}html+=list("ol",it);continue;}
    let b=[];while(i<lines.length&&!isBlock(lines[i])){b.push(lines[i]);i++;}
    html+="<p>"+inline(b.join("\n")).replace(/\n/g,"<br>")+"</p>";
  }
  return (typeof emojify==="function")?emojify(html):html;
}
const now=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());};

function ensureIds(){
  (function walk(nodes){nodes.forEach(n=>{if(!n.id)n.id=uid();if(n.type==="folder"){n.children=n.children||[];walk(n.children);}});})(DATA.kb);
  DATA.feed.forEach(p=>{if(!p.id)p.id=uid();});
}
function locate(id,nodes=DATA.kb,parent=DATA.kb,trail=[]){
  for(let i=0;i<nodes.length;i++){const n=nodes[i];
    if(n.id===id)return{node:n,parent:nodes,index:i,trail:trail};
    if(n.type==="folder"&&n.children){const r=locate(id,n.children,n.children,trail.concat(n));if(r)return r;}
  }
  return null;
}
function firstFile(nodes=DATA.kb){for(const n of nodes){if(n.type==="file")return n.id;if(n.type==="folder"){const r=firstFile(n.children||[]);if(r)return r;}}return null;}
function collectFolders(banId){const out=[];(function w(nodes,d){nodes.forEach(n=>{if(n.type==="folder"){if(n.id===banId)return;out.push({id:n.id,name:n.name,depth:d});w(n.children||[],d+1);}});})(DATA.kb,0);return out;}
function targetChildren(){const s=state.kbSel?locate(state.kbSel):null;if(s&&s.node.type==="folder"){state.expanded.add(s.node.id);return s.node.children;}if(s)return s.parent;return DATA.kb;}

async function loadData(){
  /* 失败重试一次：网络抖动时不要让内容“消失” */
  for(let i=0;i<2;i++){
    try{
      const r=await fetch("data.json?_="+Date.now(),{cache:"no-store"});
      if(r.ok){const j=await r.json();
        if(j&&j.feed){DATA=j;dirty=false;
          try{localStorage.setItem(KEY_CACHE,JSON.stringify(j))}catch(e){}
          return;}}
    }catch(e){}
    if(i===0)await new Promise(r=>setTimeout(r,700));
  }
  /* 仍取不到 -> 用上次成功加载的线上内容，而不是空白种子 */
  try{const c=JSON.parse(localStorage.getItem(KEY_CACHE));
    if(c&&c.feed){DATA=c;dirty=false;
      setTimeout(()=>toast("网络不稳，暂时显示上次缓存的内容"),900);return;}}catch(e){}
  DATA=JSON.parse(JSON.stringify(SEED));dirty=false;
}

/* 编辑工具条会占一行，内容区与右栏需要相应下移，否则会被盖住。
   直接写行内样式，避免依赖样式重算时机。 */
function syncToolbarH(){
  const m=document.querySelector("main"),rail=document.querySelector(".rail");
  const wide=innerWidth>=1081;
  if(!wide){ if(m)m.style.top=""; if(rail){rail.style.top="";rail.style.height="";} return; }
  const tb=document.querySelector(".toolbar");
  const h=(document.body.classList.contains("editing")&&tb)?Math.round(tb.getBoundingClientRect().height):0;
  const top=62+h;
  if(m)m.style.top=top+"px";
  if(rail){rail.style.top=top+"px";rail.style.height="calc(83.3333vh - "+(top+28)+"px)";}
}
addEventListener("resize",syncToolbarH);
function setEdit(on){if(on&&!ownerUnlocked)return;state.editMode=on;document.body.classList.toggle("editing",on);$("#editBtn").classList.toggle("on",on);render();updateBar();requestAnimationFrame(syncToolbarH);}
function hasDraft(){try{const d=JSON.parse(localStorage.getItem(KEY_DRAFT));return !!(d&&d.feed)}catch(e){return false}}
function updateBar(){const s=$("#tbState"),t=$("#tbText");if(!s)return;s.classList.toggle("dirty",dirty);
  t.textContent=dirty?"有未发布的修改":(hasDraft()?"显示线上版本（有未发布草稿）":"已同步线上");
  const rb=$("#restoreBtn");if(rb)rb.style.display=(!dirty&&hasDraft())?"":"none";
  /* 未发布时在“编辑”按钮上留个标记，站主一眼能看出还没同步 */
  const eb=$("#editBtn");

function cmtListHTML(cs,pid){
  const byId=new Map(cs.map(c=>[c.id,c])),root=c=>{let x=c,k=0;while(x.parent&&byId.has(x.parent)&&k++<50)x=byId.get(x.parent);return x;};
  const tops=cs.filter(c=>!c.parent||!byId.has(c.parent)),kids=new Map();
  cs.forEach(c=>{if(c.parent&&byId.has(c.parent)){const r=root(c);(kids.get(r.id)||kids.set(r.id,[]).get(r.id)).push(c);}});
  return tops.map(t=>{const ks=kids.get(t.id)||[];
    const rep=ks.length?'<div class="c-replies">'+ks.map(k=>cmtHTML(k,pid,k.parent!==t.id&&byId.get(k.parent)?byId.get(k.parent).name:null)).join("")+'</div>':'';

/* ---------- 知识库富文本：保存为 HTML（node.fmt="html"），旧文档仍按 Markdown 显示，编辑时转换 ---------- */
const HL_COLOR={y:"rgb(255, 216, 77)",r:"rgb(255, 107, 107)"};
const FMT_SEL={b:"b,strong",i:"i,em",u:"u",y:"mark.y",r:"mark.r"};
function isHtmlDoc(n){return n&&n.fmt==="html";}
function docText(n){if(!n||n.type!=="file")return "";if(isHtmlDoc(n))return tpl(n.body).content.textContent||"";return String(n.body||"").replace(/[#>*_=\x60\-\[\]()!]/g,"");}
function docChars(n){return docText(n).replace(/\s|\u200B/g,"").length;}
function tpl(html){const t=document.createElement("template");t.innerHTML=html||"";return t;}
function mdToEditor(n){
  _hl=0;const t=tpl(md(n.body||""));
  const notes=(n.notes||[]).map(x=>({id:"nt"+uid(),text:x.text||""}));
  t.content.querySelectorAll("mark.hl").forEach(m=>{const k=+m.dataset.n;["id","data-action","data-n"].forEach(a=>m.removeAttribute(a));
    if(notes[k-1])m.dataset.nid=notes[k-1].id;else m.className="y";});
  return {html:t.innerHTML,notes};
}
/* 只保留允许的标签和属性，去掉零宽字符和空的格式元素；keep：保留哪些便签锚点 */
function cleanDocHTML(html,keep){
  const t=tpl(html);
  const OK=/^(P|DIV|BR|H1|H2|H3|B|STRONG|I|EM|U|MARK|SPAN|UL|OL|LI|BLOCKQUOTE|PRE|CODE|A|IMG|HR|TABLE|THEAD|TBODY|TR|TH|TD)$/;
  const unwrap=c=>c.replaceWith(...c.childNodes);
  (function walk(node){[...node.childNodes].forEach(c=>{
    if(c.nodeType===3){c.nodeValue=c.nodeValue.replace(/\u200B/g,"");if(!c.nodeValue)c.remove();return;}
    if(c.nodeType!==1){c.remove();return;}
    walk(c);
    const tg=c.tagName;if(!OK.test(tg)){unwrap(c);return;}
    const nid=c.getAttribute("data-nid"),cls=(c.getAttribute("class")||"").split(/\s+/);
    const href=c.getAttribute("href"),src=c.getAttribute("src"),alt=c.getAttribute("alt");
    [...c.attributes].forEach(a=>c.removeAttribute(a.name));
    if(tg==="A"&&href&&!/^\s*javascript:/i.test(href)){c.setAttribute("href",href);c.setAttribute("target","_blank");c.setAttribute("rel","noopener");}
    if(tg==="IMG"){if(!src){c.remove();return;}c.setAttribute("src",src);c.setAttribute("alt",alt||"");}
    const isNote=nid&&(!keep||keep.has(nid));
    if(tg==="SPAN"){if(cls.includes("na")&&isNote){c.className="na";c.dataset.nid=nid;}else unwrap(c);return;}
    if(tg==="MARK"){
      if(nid||cls.includes("hl")){if(isNote){c.className="hl";c.dataset.nid=nid;}else unwrap(c);return;}
      const k=cls.find(x=>x==="y"||x==="r");if(k)c.className=k;else{unwrap(c);return;}
    }
    if(/^(B|STRONG|I|EM|U|MARK)$/.test(tg)&&!c.textContent)c.remove();
  });})(t.content);
  return t.innerHTML.trim();
}
/* 显示：给锚点按出现顺序编号，便签按同样顺序排列 */
function viewDoc(node){
  if(!isHtmlDoc(node)){_hl=0;return {html:md(node.body),notes:(node.notes||[]).map(n=>n.text)};}
  const t=tpl(node.body),order=[];
  t.content.querySelectorAll("[data-nid]").forEach(a=>{const i=order.length+1;order.push(a.dataset.nid);a.id="hl-"+i;a.dataset.n=i;a.dataset.action="kb-hl";});
  const rank=n=>{const i=order.indexOf(n.id);return i<0?1e9:i;};
  return {html:t.innerHTML,notes:(node.notes||[]).slice().sort((a,b)=>rank(a)-rank(b)).map(n=>n.text)};
}
/* 下载用：HTML 转回 Markdown */
function htmlToMd(html){
  const inl=n=>[...n.childNodes].map(c=>{
    if(c.nodeType===3)return c.nodeValue.replace(/\u200B/g,"");if(c.nodeType!==1)return "";
    const tg=c.tagName,x=inl(c);
    if(tg==="B"||tg==="STRONG")return x.trim()?"**"+x+"**":x;
    if(tg==="I"||tg==="EM")return x.trim()?"*"+x+"*":x;
    if(tg==="U")return "<u>"+x+"</u>";
    if(tg==="MARK")return c.classList.contains("hl")?"=="+x+"==":'<mark class="'+c.className+'">'+x+'</mark>';
    if(tg==="CODE")return "`"+c.textContent+"`";
    if(tg==="A")return "["+x+"]("+c.getAttribute("href")+")";
    if(tg==="IMG")return "!["+(c.getAttribute("alt")||"")+"]("+c.getAttribute("src")+")";
    if(tg==="BR")return "\n";
    return x;}).join("");
  const blk=(n,pre)=>[...n.childNodes].map(c=>{
    if(c.nodeType===3)return c.nodeValue.trim()?pre+c.nodeValue.trim()+"\n\n":"";if(c.nodeType!==1)return "";
    const tg=c.tagName;
    if(/^H[1-3]$/.test(tg))return pre+"#".repeat(+tg[1])+" "+inl(c).trim()+"\n\n";
    if(tg==="UL"||tg==="OL")return [...c.children].map((li,i)=>pre+(tg==="OL"?(i+1)+". ":"- ")+inl(li).trim()).join("\n")+"\n\n";
    if(tg==="BLOCKQUOTE")return blk(c,pre+"> ");
    if(tg==="PRE")return "```\n"+c.textContent.replace(/\n$/,"")+"\n```\n\n";
    if(tg==="HR")return "---\n\n";
    if(tg==="TABLE")return [...c.querySelectorAll("tr")].map((tr,i)=>{const row="| "+[...tr.children].map(td=>inl(td).trim()).join(" | ")+" |";return i===0?row+"\n|"+[...tr.children].map(()=>"---|").join(""):row;}).join("\n")+"\n\n";
    const x=inl(c).trim();return x?pre+x.replace(/\n/g,"\n"+pre)+"\n\n":"";
  }).join("");
  return blk(tpl(html).content,"").trim()+"\n";
}

/* ---------- 编辑器：格式按钮 ---------- */
function rteEl(){return document.getElementById("fe-body");}
function rteRange(){
  const ed=rteEl(),sel=getSelection();if(!ed)return null;
  let r=sel.rangeCount?sel.getRangeAt(0):null;
  if(!r||!ed.contains(r.commonAncestorContainer)){ed.focus();r=document.createRange();r.selectNodeContents(ed);r.collapse(false);sel.removeAllRanges();sel.addRange(r);}
  if(r.collapsed&&r.startContainer===ed){              /* 光标落在段落之间：移进相邻段落 */
    let blk=ed.childNodes[r.startOffset-1],atEnd=true;
    if(!blk){blk=ed.childNodes[r.startOffset];atEnd=false;}
    if(!blk){blk=document.createElement("p");blk.appendChild(document.createElement("br"));ed.appendChild(blk);}
    if(blk.nodeType===1&&!/^(UL|OL|TABLE|PRE|HR)$/.test(blk.tagName)){r=document.createRange();r.selectNodeContents(blk);r.collapse(!atEnd);sel.removeAllRanges();sel.addRange(r);}
  }
  return r;
}
function setCaret(node,off){const r=document.createRange();r.setStart(node,off);r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r);}
function fmtsAt(node){const ed=rteEl(),out=new Set();for(let n=node;n&&n!==ed;n=n.parentNode){if(n.nodeType!==1)continue;for(const k in FMT_SEL)if(n.matches(FMT_SEL[k]))out.add(k);}return out;}
function closestFmt(node,k){const ed=rteEl();for(let n=node;n&&n!==ed;n=n.parentNode)if(n.nodeType===1&&n.matches(FMT_SEL[k]))return n;return null;}
function fmtEl(k){if(k==="y"||k==="r"){const m=document.createElement("mark");m.className=k;return m;}return document.createElement(k);}
/* 光标处补上当前开启的格式：插入带零宽字符的格式元素，之后输入（包括输入法）都落在里面 */
function ensureCaretFmt(){
  const r=rteRange();if(!r||!r.collapsed)return;
  const have=fmtsAt(r.startContainer);
  ["y","r"].forEach(k=>{if(have.has(k)&&state.fmtOn.has(k==="y"?"r":"y")){exitFmt(k);have.delete(k);}});
  const need=[...state.fmtOn].filter(k=>k!=="h"&&!have.has(k));if(!need.length)return;
  const r2=rteRange();let outer=null,inner=null;
  need.forEach(k=>{const e=fmtEl(k);if(inner)inner.appendChild(e);else outer=e;inner=e;});
  const z=document.createTextNode("\u200B");inner.appendChild(z);r2.insertNode(outer);setCaret(z,1);
}
/* 关闭某个格式：在光标处把该格式元素拆开，光标移到它外面 */
function exitFmt(k){
  const r=rteRange();if(!r||!r.collapsed)return;
  const el=closestFmt(r.startContainer,k);if(!el)return;
  const tail=document.createRange();tail.setStart(r.startContainer,r.startOffset);tail.setEnd(el,el.childNodes.length);
  const after=el.cloneNode(false);after.appendChild(tail.extractContents());
  el.after(after);if(!after.textContent.replace(/\u200B/g,""))after.remove();
  const z=document.createTextNode("\u200B");el.after(z);
  if(!el.textContent.replace(/\u200B/g,""))el.remove();
  setCaret(z,1);
}
/* 选中文字时的黄/红高亮：交给浏览器拆分合并，再统一换回 <mark> */
function textOffsets(ed,r){const pre=document.createRange();pre.selectNodeContents(ed);pre.setEnd(r.startContainer,r.startOffset);const a=pre.toString().length;return [a,a+r.toString().length];}
function restoreOffsets(ed,a,b){
  const it=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT);let n,pos=0,r=document.createRange(),sa=false;
  while((n=it.nextNode())){const L=n.nodeValue.length;
    if(!sa&&a<pos+L){r.setStart(n,a-pos);sa=true;}
    if(sa&&b<=pos+L){r.setEnd(n,b-pos);break;}pos+=L;}
  const s=getSelection();s.removeAllRanges();s.addRange(r);
}
function highlightSel(k){
  const ed=rteEl(),r=rteRange();const [a,b]=textOffsets(ed,r);
  let all=true;const it=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT);let n;
  while((n=it.nextNode())){
    if(!r.intersectsNode(n)||(n===r.startContainer&&r.startOffset>=n.length)||(n===r.endContainer&&r.endOffset===0))continue;
    if(!n.nodeValue.replace(/\u200B/g,"").trim())continue;if(!closestFmt(n,k)){all=false;break;}}
  ed.querySelectorAll("mark.y,mark.r").forEach(m=>{const sp=document.createElement("span");sp.style.backgroundColor=HL_COLOR[m.className];while(m.firstChild)sp.appendChild(m.firstChild);m.replaceWith(sp);});
  restoreOffsets(ed,a,b);
  document.execCommand("styleWithCSS",false,true);
  document.execCommand("hiliteColor",false,all?"transparent":HL_COLOR[k]);
  document.execCommand("styleWithCSS",false,false);
  const [a2,b2]=textOffsets(ed,rteRange());
  ed.querySelectorAll("[style]").forEach(el=>{
    const bg=el.style.backgroundColor,k2=Object.keys(HL_COLOR).find(x=>HL_COLOR[x]===bg);el.style.backgroundColor="";
    if(!el.getAttribute("style"))el.removeAttribute("style");
    if(k2){const m=fmtEl(k2);if(el.tagName==="SPAN"&&!el.attributes.length){while(el.firstChild)m.appendChild(el.firstChild);el.replaceWith(m);}else{while(el.firstChild)m.appendChild(el.firstChild);el.appendChild(m);}}
    else if(el.tagName==="SPAN"&&!el.attributes.length)el.replaceWith(...el.childNodes);
  });
  ed.normalize();restoreOffsets(ed,a2,b2);
}
function kbFmt(k){
  const ed=rteEl();if(!ed)return;
  if(k==="note"){addNoteAtCaret();return;}
  const r=rteRange();
  if(!r.collapsed){                                   /* 选中文字：只作用于选中部分 */
    if(k==="h"){const cur=String(document.queryCommandValue("formatBlock")).toLowerCase();document.execCommand("formatBlock",false,cur==="h2"?"<p>":"<h2>");}
    else if(k==="y"||k==="r")highlightSel(k);
    else{document.execCommand("styleWithCSS",false,false);document.execCommand({b:"bold",i:"italic",u:"underline"}[k]);}
  }else{                                              /* 未选中：开关持续格式 */
    if(k==="h"){const on=!state.fmtOn.has("h");on?state.fmtOn.add("h"):state.fmtOn.delete("h");document.execCommand("formatBlock",false,on?"<h2>":"<p>");}
    else if(state.fmtOn.has(k)){state.fmtOn.delete(k);exitFmt(k);ensureCaretFmt();}
    else{const o=k==="y"?"r":k==="r"?"y":null;if(o&&state.fmtOn.has(o)){state.fmtOn.delete(o);exitFmt(o);}state.fmtOn.add(k);ensureCaretFmt();}
  }
  updateTb();syncNotesOrder();scheduleLines();
}
function updateTb(){document.querySelectorAll("#kbTb [data-fmt]").forEach(b=>b.classList.toggle("on",state.fmtOn.has(b.dataset.fmt)));}
function addNoteAtCaret(){
  const r=rteRange();r.collapse(false);
  const id="nt"+uid(),a=document.createElement("span");a.className="na";a.dataset.nid=id;a.contentEditable="false";
  r.insertNode(a);const z=document.createTextNode("\u200B");a.after(z);setCaret(z,1);
  state.fileBuf.notes.push({id,text:""});syncNotesOrder(true);
  const t=document.querySelector('textarea[data-note-id="'+id+'"]');if(t)t.focus();

/* ---------- 便签连线：锚点文字底部向右延伸，折到右侧对应便签 ---------- */
let _lnRaf=0;
function scheduleLines(){if(_lnRaf)return;_lnRaf=requestAnimationFrame(()=>{_lnRaf=0;drawNoteLines();});}
function drawNoteLines(){
  let svg=document.getElementById("noteLines");
  const main=document.querySelector(".kb-main"),aside=document.querySelector(".kb-notes");
  const clear=()=>{if(svg)svg.innerHTML="";};
  if(state.view!=="kb"||!main||!aside)return clear();
  const mr=main.getBoundingClientRect(),ar=aside.getBoundingClientRect();
  if(ar.left<mr.right||!ar.width)return clear();      /* 便签栏不在右侧（窄屏）时不画 */
  if(!svg){svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.id="noteLines";document.body.appendChild(svg);}
  const sc=document.querySelector("main").getBoundingClientRect();
  const top=Math.max(0,sc.top,mr.top),bot=Math.min(innerHeight,sc.bottom,mr.bottom);
  const ed=!!(state.editingFile&&rteEl());
  let d="";
  main.querySelectorAll(ed?"#fe-body [data-nid]":".md [data-n]").forEach(a=>{
    const key=ed?a.dataset.nid:a.dataset.n;
    const note=aside.querySelector(ed?'.sticky[data-nid="'+key+'"]':"#note-"+key);if(!note)return;
    const rc=a.getClientRects()[0]||a.getBoundingClientRect();
    const ax=Math.round(rc.left)+.5,ay=Math.round(rc.bottom)+3;
    if(ay<top||ay>bot)return;
    const nr=note.getBoundingClientRect();
    const ny=Math.round(Math.min(Math.max(nr.top+16,ar.top+8),ar.bottom-8)),nx=Math.round(nr.left);
    const mx=Math.round(mr.right+(nx-mr.right)/2);
    d+="M"+ax+" "+ay+"H"+mx+"V"+ny+"H"+nx;
  });
  svg.innerHTML=d?'<path d="'+d+'"/>':"";
}

/* B站接口不允许跨域，但支持 JSONP。JSONP 会执行对方返回的脚本，所以放进沙盒 iframe（无同源权限，
   读不到本页的 localStorage / 发布令牌）里取，只把需要的字段传回来 */
function biliInfo(bvid){
  return new Promise(resolve=>{
    if(!/^BV\w+$/i.test(bvid))return resolve(null);
    const fr=document.createElement("iframe"),id=Math.random().toString(36).slice(2);
    fr.setAttribute("sandbox","allow-scripts");fr.style.display="none";
    let done=false;
    const finish=v=>{if(done)return;done=true;removeEventListener("message",onMsg);fr.remove();resolve(v);};
    const onMsg=e=>{if(e.source!==fr.contentWindow||!e.data||e.data.id!==id)return;const d=e.data.d;
      finish(d?{cover:/^https?:\/\//.test(d.pic||"")?String(d.pic).replace(/^http:/,"https:"):"",title:String(d.title||""),author:String(d.author||"")}:null);};
    addEventListener("message",onMsg);
    fr.srcdoc='<script>function cb(j){var d=j&&j.code===0&&j.data;parent.postMessage({id:"'+id+'",d:d?{pic:d.pic,title:d.title,author:d.owner&&d.owner.name}:null},"*")}<\/script>'
      +'<script src="https://api.bilibili.com/x/web-interface/view?bvid='+encodeURIComponent(bvid)+'&jsonp=jsonp&callback=cb" onerror="cb(null)"><\/script>';
    document.body.appendChild(fr);setTimeout(()=>finish(null),6000);
  });
}

function authorOf(it){
  if(it.author)return it.author;
  const m=String(it.url||"").match(/bilibili\.com\/video\/(BV[\w]+)/i);
  if(m&&!_authorAsk.has(m[1])){_authorAsk.add(m[1]);biliInfo(m[1]).then(i=>{if(i&&i.author){it.author=i.author;render();}});}
  return "";}

  if(m=url.match(/bilibili\.com\/video\/(BV[\w]+)/i))return{src:"Bilibili",embed:"https://player.bilibili.com/player.html?bvid="+m[1]+"&page=1&autoplay=0",thumb:null,icon:""};
  return{src:"网页",embed:null,thumb:null,icon:""};}

function toB64(str){const bytes=new TextEncoder().encode(str);let bin="";const ch=0x8000;for(let i=0;i<bytes.length;i+=ch)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+ch));return btoa(bin);}
async function publish(){
  const cfg=ghCfg();if(!cfg.token){toast("请先在发布设置里填 GitHub 令牌");openSettings();return;}
  const base="https://api.github.com/repos/"+cfg.owner+"/"+cfg.repo+"/contents/"+cfg.path;
  const headers={Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  toast("正在发布…");
  try{
    await uploadPendingPhotos(cfg,headers);
    let sha=null;
    try{const r=await fetch(base+"?ref="+encodeURIComponent(cfg.branch),{headers,cache:"no-store"});if(r.ok)sha=(await r.json()).sha;}catch(e){}
    const body={message:"更新内容（网页编辑器）",content:toB64(JSON.stringify(exportData(),null,2)),branch:cfg.branch};if(sha)body.sha=sha;
    const put=await fetch(base,{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},headers),body:JSON.stringify(body)});
    if(put.ok){clearDraft();toast("已发布，网站约 1 分钟后更新");}
    else{const e=await put.json().catch(()=>({}));toast("发布失败："+(e.message||put.status));}
  }catch(e){toast("发布出错："+e.message);}
}

function openGallery(srcs,i){
  if(!srcs.length)return;
  const bg=document.createElement("div");bg.className="lightbox gal";
  bg.innerHTML='<img alt=""><span class="gal-n"></span>'
    +(srcs.length>1?'<button class="gal-b prev" aria-label="上一张"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg></button><button class="gal-b next" aria-label="下一张"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 18 6-6-6-6"/></svg></button>':'');
  const img=bg.querySelector("img"),n=bg.querySelector(".gal-n");
  const show=k=>{i=(k+srcs.length)%srcs.length;img.classList.remove("ok");img.onload=()=>img.classList.add("ok");img.src=srcs[i];if(img.complete)img.classList.add("ok");
    n.textContent=srcs.length>1?(i+1)+" / "+srcs.length:"";};
  const close=()=>{document.removeEventListener("keydown",onKey);closeEl(bg);};
  const onKey=e=>{if(e.key==="Escape")close();else if(e.key==="ArrowLeft")show(i-1);else if(e.key==="ArrowRight")show(i+1);};
  bg.addEventListener("click",e=>{const b=e.target.closest(".gal-b");if(b){e.stopPropagation();show(i+(b.classList.contains("next")?1:-1));return;}if(e.target!==img)close();});
  let tx=null;bg.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;},{passive:true});
  bg.addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>40)show(i+(dx<0?1:-1));});
  document.addEventListener("keydown",onKey);document.body.appendChild(bg);show(i);
}

/* ---------- 贡献格（真实 GitHub 提交记录） ---------- */
const dkey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

async function fetchContrib(force){
  const cfg=ghCfg(),KEY="myspace-contrib";
  if(!force){try{const c=JSON.parse(localStorage.getItem(KEY));
    if(c&&c.owner===cfg.owner&&c.repo===cfg.repo&&Date.now()-c.t<10*60e3)return c.days;}catch(e){}}
  const t0=new Date();const since=new Date(t0.getFullYear(),t0.getMonth()-11,1).toISOString();
  const days={};
  for(let page=1;page<=3;page++){
    const r=await fetch("https://api.github.com/repos/"+cfg.owner+"/"+cfg.repo
      +"/commits?per_page=100&page="+page+"&since="+since,{headers:{Accept:"application/vnd.github+json"}});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const arr=await r.json();if(!arr.length)break;
    arr.forEach(c=>{const t=(c.commit&&c.commit.author&&c.commit.author.date)||(c.commit&&c.commit.committer&&c.commit.committer.date);
      if(!t)return;days[dkey(new Date(t))]=(days[dkey(new Date(t))]||0)+1;});
    if(arr.length<100)break;
  }
  try{localStorage.setItem(KEY,JSON.stringify({owner:cfg.owner,repo:cfg.repo,t:Date.now(),days}))}catch(e){}
  return days;
}
const WD=["日","一","二","三","四","五","六"];
function contribGridHTML(days){
  const today=new Date();today.setHours(0,0,0,0);
  const start=new Date(today);start.setDate(start.getDate()-(52*7+today.getDay()));
  const lvl=n=>n===0?0:n===1?1:n===2?2:n<=4?3:4;
  let rows='<span></span>'+WD.map(w=>'<span class="cg-wd">'+w+'</span>').join("");
  let total=0;
  for(let w=0;w<53;w++){
    /* 这一周若包含某月 1 号，就在行首标出月份数字 */
    let label="";
    for(let d=0;d<7;d++){
      const day=new Date(start);day.setDate(day.getDate()+w*7+d);
      if(day.getDate()===1&&day<=today){label=(day.getMonth()+1)+"月";break;}
    }
    rows+='<span class="cg-m">'+label+'</span>';
    for(let d=0;d<7;d++){
      const day=new Date(start);day.setDate(day.getDate()+w*7+d);
      if(day>today){rows+='<span class="cg" style="visibility:hidden"></span>';continue;}
      const k=dkey(day),n=days[k]||0;total+=n;
      rows+='<span class="cg"'+(n?' data-l="'+lvl(n)+'"':'')+' title="'+k+' · '+n+' 次修改"></span>';
    }
  }
  setTimeout(()=>{const n=$("#cgN");if(n)n.textContent=total;},0);
  return ''
    +'<div class="cgrid-wrap"><div class="cgrid">'+rows+'</div></div>'
    +'<div class="cg-legend"><span>less</span>'
    +'<span class="cg"></span><span class="cg" data-l="1"></span><span class="cg" data-l="2"></span>'
    +'<span class="cg" data-l="3"></span><span class="cg" data-l="4"></span><span>more</span></div>';
}
