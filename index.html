/* ---------- 照片：压缩 & 上传 ---------- */
const WEBP_OK=(()=>{try{const c=document.createElement("canvas");c.width=c.height=1;return c.toDataURL("image/webp").indexOf("data:image/webp")===0;}catch(e){return false;}})();
function extOf(dataUrl){const m=/^data:image\/(\w+)/.exec(dataUrl);const t=m?m[1]:"jpeg";return t==="jpeg"?"jpg":t;}
/* 配图压缩：长边不超过 1920，优先 WebP(.82，同等清晰度体积更小)，不支持则 JPEG；GIF 保留动画；压完反而更大的小图保留原图 */
function compressImg(file){
  return new Promise((res,rej)=>{const rd=new FileReader();
    rd.onerror=()=>rej(new Error("读取失败"));
    rd.onload=()=>{const orig=String(rd.result);
      if(file.type==="image/gif"){res(orig);return;}
      const img=new Image();
      img.onerror=()=>rej(new Error("不是有效图片"));
      img.onload=()=>{const max=1920;let w=img.width,h=img.height;const sc=Math.min(1,max/Math.max(w,h));
        w=Math.round(w*sc);h=Math.round(h*sc);
        const c=document.createElement("canvas");c.width=w;c.height=h;
        const g=c.getContext("2d");if(!WEBP_OK){g.fillStyle="#fff";g.fillRect(0,0,w,h);}
        g.imageSmoothingQuality="high";g.drawImage(img,0,0,w,h);
        const out=WEBP_OK?c.toDataURL("image/webp",.82):c.toDataURL("image/jpeg",.86);
        res(sc===1&&out.length>=orig.length?orig:out);};
      img.src=orig;};
    rd.readAsDataURL(file);});
}

/* ---------- 照片：拖动移动 / 单击缩放 / 双击归位 / 滚轮缩放 ---------- */
(function(){
  let drag=null,clickTimer=null;
  document.addEventListener("pointerdown",e=>{
    const el=e.target.closest(".photo");if(!el)return;
    if(e.target.closest("[data-action]"))return;      /* 删除按钮不触发拖动 */
    if(e.button!==0)return;
    e.preventDefault();                                /* 不选中文字、不触发浏览器原生拖拽 */
    const v=pv(el.dataset.pid);
    drag={el:el,id:el.dataset.pid,sx:e.clientX,sy:e.clientY,ox:v.x,oy:v.y,moved:0};
    el.classList.add("dragging","grabbing");
    try{el.setPointerCapture(e.pointerId);}catch(_){}
  });
  /* 拖动被中断（原生拖拽、切窗口等）时直接放下，避免照片粘在鼠标上 */
  function dropPhoto(){if(!drag)return;const d=drag;drag=null;d.el.classList.remove("grabbing");if(d.moved<=4)d.el.classList.remove("dragging");}
  document.addEventListener("pointercancel",dropPhoto);
  document.addEventListener("lostpointercapture",e=>{if(drag&&e.target===drag.el)setTimeout(dropPhoto,0);});
  window.addEventListener("blur",dropPhoto);
  document.addEventListener("dragstart",e=>{if(e.target.closest&&e.target.closest(".photo"))e.preventDefault();});
  document.addEventListener("pointermove",e=>{
    if(!drag)return;
    if(e.pointerType==="mouse"&&!(e.buttons&1)){dropPhoto();return;}   /* 已经松开了键 */
    const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    drag.moved=Math.max(drag.moved,Math.abs(dx)+Math.abs(dy));
    const v=pv(drag.id);v.x=drag.ox+dx;v.y=drag.oy+dy;applyPV(drag.el);
  });
  document.addEventListener("pointerup",e=>{
    if(!drag)return;const d=drag;drag=null;
    d.el.classList.remove("grabbing");
    if(d.moved<=4)d.el.classList.remove("dragging");
    if(d.moved>4)return;                               /* 拖动过就不算点击 */
    clearTimeout(clickTimer);
    clickTimer=setTimeout(()=>{                        /* 等一下，看是不是双击 */
      const ps=photoList(),i=ps.findIndex(p=>p.id===d.id);
      if(i>=0)openGallery(ps.map(p=>p.src),i);
    },230);
  });
  document.addEventListener("dblclick",e=>{
    const el=e.target.closest(".photo");if(!el)return;
    clearTimeout(clickTimer);                          /* 取消单击的缩放 */
    const v=pv(el.dataset.pid);v.x=0;v.y=0;v.s=1;applyPV(el);
  });
  /* 滚轮在竖分割线右侧：上下滑动右栏内容 */
  let railY=0;
  document.addEventListener("wheel",e=>{
    if(innerWidth<1081)return;
    if(e.clientX < innerWidth*0.8)return;            /* 只在竖线右侧生效 */
    const rail=document.querySelector(".rail"),inner=document.querySelector(".rail-scroll");
    if(!rail||!inner)return;
    const avail=rail.clientHeight||rail.getBoundingClientRect().height;
    const over=inner.scrollHeight-avail;
    if(over<=0){railY=0;inner.style.transform="translateY(0px)";return;}
    e.preventDefault();
    railY=Math.min(0,Math.max(-over,railY-e.deltaY));
    inner.style.transform="translateY("+Math.round(railY)+"px)";
  },{passive:false});
})();

/* 横分割线上的青色段：滑到当前板块正下方 */
let hlPos=null;
function moveHLine(){
  const mark=$("#hlineMark");if(!mark)return;
  const i=Math.max(0,["feed","kb","fav"].indexOf(state.view));
  /* 停靠点：底边栏对应那一栏（动态 → LATEST，知识库 → READING，收藏 → VIDEOS）的左缘，宽度与该栏相同 */
  const fb=$("#footBand"),cell=fb&&fb.children[i];if(!cell)return;
  const r=cell.getBoundingClientRect(),w=Math.round(r.width),W=innerWidth;
  const wall=W*0.8;                               /* 竖分割线的位置 */
  const bounce=Math.max(80,W*0.06);               /* 越过停靠点再弹回的长度 */
  const to=Math.round(r.left);
  mark.style.width=w+"px";
  const from=hlPos;hlPos=to;
  mark.style.transform="translateX("+to+"px)";
  if(from===null||Math.abs(from-to)<1||!mark.animate)return;
  const dir=to>from?1:-1;
  const peak=Math.round(dir>0?Math.min(to+bounce,wall-w):Math.max(0,to-bounce));   /* 往右不越过竖分割线 */
  mark.getAnimations().forEach(a=>a.cancel());    /* 连续切换时不叠加 */
  mark.animate([
    {transform:"translateX("+Math.round(from)+"px)",easing:"cubic-bezier(.35,0,.2,1)"},
    {transform:"translateX("+peak+"px)",offset:.56,easing:"cubic-bezier(.3,0,.25,1)"},
    {transform:"translateX("+to+"px)"}
  ],{duration:900});
}
addEventListener("resize",()=>{hlPos=null;moveHLine();});

function emojify(html){
  try{
    /* 只替换标签之外的文本节点，避免破坏 href/alt 等属性 */
    return html.replace(/(<[^>]*>)|([^<]+)/g,(m,tag,text)=>{
      if(tag)return tag;

        const code=[...x].filter(c=>c.codePointAt(0)!==0xFE0F)
          .map(c=>c.codePointAt(0).toString(16)).join("-");

}

function searchIndex(q){
  const em=state.editMode,ql=q.toLowerCase(),out={feed:[],kb:[],fav:[]};
  const snip=(t)=>{t=plain(t);const i=t.toLowerCase().indexOf(ql);if(i<0)return t.slice(0,80);const a=Math.max(0,i-20);return (a?"…":"")+t.slice(a,a+80);};
  DATA.feed.forEach(p=>{if(!em&&p.hidden)return;if(plain(p.text).toLowerCase().includes(ql))out.feed.push({t:plain(p.text).slice(0,40),s:p.date+"  "+snip(p.text),go:{view:"feed",id:p.id}});});
  (function w(ns,trail){ns.forEach(n=>{if(!em&&n.hidden)return;if(n.type==="folder"){w(n.children||[],trail.concat(n.name));return;}
    const txt=docText(n),hay=(n.name+" "+(n.tags||[]).join(" ")+" "+txt).toLowerCase();
    if(hay.includes(ql))out.kb.push({t:n.name,s:txt.toLowerCase().includes(ql)?snip(txt):trail.join(" / "),go:{view:"kb",id:n.id}});});})(DATA.kb,[]);
  DATA.fav.forEach((f,fi)=>{if(!em&&f.hidden)return;(f.items||[]).forEach((it,ii)=>{if(!em&&it.hidden)return;
    if((it.title+" "+it.url).toLowerCase().includes(ql))out.fav.push({t:it.title,s:f.name+"  "+it.url.replace(/^https?:\/\//,""),go:{view:"fav",f:fi,i:ii}});});});
  return out;
}
function hiliteQ(t,q){const e=esc(t);if(!q)return e;const i=t.toLowerCase().indexOf(q.toLowerCase());if(i<0)return e;
  return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length));}
function openSearch(){
  if($("#cpBg"))return;
  const bg=document.createElement("div");bg.className="cp-bg";bg.id="cpBg";
  bg.innerHTML='<div class="cp"><div class="cp-in"><svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="cp-input" placeholder="搜索" autocomplete="off" spellcheck="false"><kbd>Esc</kbd></div><div class="cp-list"></div></div>';
  document.body.appendChild(bg);
  const inp=bg.querySelector("input"),list=bg.querySelector(".cp-list");let items=[],sel=0;
  const close=()=>{document.removeEventListener("keydown",key,true);closeEl(bg);};
  const go=it=>{close();const g=it.go;state.view=g.view;state.feedOpen=null;state.favItem=null;state.editingFile=false;state.feedMonth="";
    if(g.view==="feed")state.feedOpen=g.id;else if(g.view==="kb")state.kbSel=g.id;else{state.favFolder=g.f;state.favItem=g.i;}render();};
  const draw=()=>{const q=inp.value.trim();if(!q){list.innerHTML="";items=[];return;}
    const r=searchIndex(q);items=[];let h="";
    [["feed","动态"],["kb","文档"],["fav","收藏"]].forEach(([k,label])=>{if(!r[k].length)return;h+='<div class="cp-g ph-title">'+label+'</div>';
      r[k].slice(0,8).forEach(it=>{h+='<div class="cp-it" data-k="'+items.length+'"><div class="cp-t">'+hiliteQ(it.t,q)+'</div><div class="cp-s">'+hiliteQ(it.s,q)+'</div></div>';items.push(it);});});
    list.innerHTML=h||'<div class="cp-none">无结果</div>';sel=0;mark();};
  const mark=()=>{list.querySelectorAll(".cp-it").forEach(el=>el.classList.toggle("on",+el.dataset.k===sel));const on=list.querySelector(".cp-it.on");if(on)on.scrollIntoView({block:"nearest"});};
  const key=e=>{if(e.key==="Escape"){e.preventDefault();close();}
    else if(e.key==="ArrowDown"&&items.length){e.preventDefault();sel=(sel+1)%items.length;mark();}
    else if(e.key==="ArrowUp"&&items.length){e.preventDefault();sel=(sel-1+items.length)%items.length;mark();}
    else if(e.key==="Enter"&&items[sel]){e.preventDefault();go(items[sel]);}};
  document.addEventListener("keydown",key,true);
  inp.addEventListener("input",draw);
  list.addEventListener("mousemove",e=>{const it=e.target.closest(".cp-it");if(it&&+it.dataset.k!==sel){sel=+it.dataset.k;mark();}});
  list.addEventListener("click",e=>{const it=e.target.closest(".cp-it");if(it)go(items[+it.dataset.k]);});
  bg.addEventListener("mousedown",e=>{if(e.target===bg)close();});
  inp.focus();
}
document.addEventListener("keydown",e=>{
  const typing=e.target.closest&&e.target.closest("input,textarea,select,[contenteditable]");
  if(((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k")||(e.key==="/"&&!typing&&!e.ctrlKey&&!e.metaKey)){e.preventDefault();openSearch();return;}
  if(e.code==="Backquote"&&!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");}
});

/* ---------- 网址路由：#/feed  #/post/<id>  #/kb/<id>  #/fav/<夹>/<项>  —— 可分享、可后退 ---------- */
function routeHash(){
  if(state.view==="kb")return "#/kb"+(state.kbSel?"/"+state.kbSel:"");
  if(state.view==="fav")return "#/fav/"+state.favFolder+(state.favItem!=null?"/"+state.favItem:"");
  return state.feedOpen?"#/post/"+state.feedOpen:"#/feed";
}
function applyRoute(){
  const p=location.hash.replace(/^#\/?/,"").split("/").map(decodeURIComponent);
  state.feedOpen=null;state.favItem=null;state.editingFile=false;state.editingPost=null;
  if(p[0]==="kb"){state.view="kb";if(p[1]&&locate(p[1]))state.kbSel=p[1];}
  else if(p[0]==="fav"){state.view="fav";if(p[1]!=null&&p[1]!=="")state.favFolder=+p[1]||0;if(p[2]!=null&&p[2]!=="")state.favItem=+p[2];}
  else if(p[0]==="post"&&p[1]){state.view="feed";state.feedOpen=p[1];}
  else state.view="feed";
}
let _routeReady=false;
function syncRoute(){
  const h=routeHash();if(location.hash===h)return;
  try{history[_routeReady?"pushState":"replaceState"](null,"",location.pathname+location.search+h);}catch(e){}
  _routeReady=true;
}
addEventListener("popstate",()=>{closeViewer();applyRoute();render();});

function render(){
  document.body.dataset.view=state.view;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("active",b.dataset.view===state.view));
  moveHLine();moveTabInk();

  if(state.view==="feed")renderFeed();else if(state.view==="kb")renderKB();else renderFav();
  scheduleLines();syncRoute();
  syncToolbarH();
}
async function boot(){
  await loadData();
  /* 站主：有未发布草稿时自动恢复，避免刷新后误以为内容丢失（访客始终看已发布版本） */
  if(ownerUnlocked&&hasDraft()){
    try{const d=JSON.parse(localStorage.getItem(KEY_DRAFT));
      if(d&&d.feed){DATA=d;dirty=true;
        setTimeout(()=>toast("已恢复未发布的草稿"),700);}
    }catch(e){}
  }
  ensureIds();
  if(!DATA.profile)DATA.profile={name:"我",avatar:""};
  setFavicon();
  if(!Array.isArray(DATA.photos))DATA.photos=[];
  if(!Array.isArray(DATA.contacts)||!DATA.contacts.length)DATA.contacts=JSON.parse(JSON.stringify(CONTACT_SEED));
  state.expanded=new Set();(function w(nodes){nodes.forEach(n=>{if(n.type==="folder"){state.expanded.add(n.id);w(n.children||[]);}});})(DATA.kb);
  if(!state.kbSel||!locate(state.kbSel))state.kbSel=firstFile();
  if(ownerUnlocked){$("#editBtn").style.display="";
    verifyOwner(ghCfg().token).then(ok=>{if(ok===false){lockOwner();toast("编辑权限已失效");}});}   // 每次打开后台重新校验
  if(wantUnlock&&!ownerUnlocked)setTimeout(openUnlock,300);
  if(/^#\//.test(location.hash))applyRoute();else _routeReady=false;
  updateBar();render();_routeReady=true;
  loadSocial();
}
boot();
</script>
